<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<meta name="description" content="Des petits jeux pour le téléphone : Le Fournil, la boulangerie en 3D, et d’autres à venir.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jeux">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/accueil.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/accueil-180.png">
<title>Salle de jeux</title>
<script>
// L'écran d'accueil du dépôt : chaque jeu vit dans son dossier (fournil/…). Ce fichier n'est pas généré : on l'édite à la main.
// Une icône « Le Fournil » installée avant l'existence de cet accueil ouvre la racine en plein écran : on l'emmène droit au jeu.
// L'accueil installé pour lui-même s'ouvre avec ?app=accueil (voir manifest.webmanifest) et reste ici.
(function () {
  try {
    const seul = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    if (seul && !/[?&]app=accueil/.test(location.search)) location.replace('fournil/');
  } catch (e) { /* rien */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap">
<style>
:root {
  --creme: #FFF7EC; --carte: #FFFFFF; --texte: #4A3328; --texte-2: #8C6F62; --trait: #EADFD6;
  --beurre: #FFC84A; --beurre-sombre: #E0A61E; --lavande: #B8A6FF; --lavande-pale: #F1ECFF; --menthe: #5FD3A4;
  --titre: 'Fredoka', 'Nunito', system-ui, sans-serif; --texte-font: 'Nunito', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--creme); color: var(--texte); }
body { font: 700 16px/1.45 var(--texte-font); -webkit-tap-highlight-color: transparent; min-height: 100vh; min-height: 100dvh; }
main { max-width: 520px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 14px; margin: 4px 0 22px; }
header img { width: 60px; height: 60px; flex: 0 0 auto; border-radius: 16px; box-shadow: 0 4px 0 var(--trait); }
h1 { margin: 0; font: 700 clamp(28px, 8vw, 34px)/1.05 var(--titre); letter-spacing: -.01em; }
header p { margin: 4px 0 0; color: var(--texte-2); font-size: 15px; }
h2 { margin: 0 0 10px; font: 700 14px/1 var(--texte-font); color: var(--texte-2); text-transform: uppercase; letter-spacing: .08em; }
#jeux { display: grid; gap: 14px; }
.jeu { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: center; padding: 16px; border-radius: 24px; background: var(--carte); box-shadow: 0 5px 0 var(--trait); color: inherit; text-decoration: none; transition: transform .12s ease, box-shadow .12s ease; }
.jeu:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--trait); }
.jeu:focus-visible { outline: 3px solid var(--lavande); outline-offset: 3px; }
.jeu .vignette { width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center; background: var(--fond, #FFF1D6); }
.jeu .vignette img { width: 64px; height: 64px; }
.jeu h3 { margin: 0; font: 700 22px/1.1 var(--titre); }
.jeu .genre { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 999px; background: var(--fond, #FFF1D6); font: 800 11px/1.5 var(--texte-font); }
.jeu p { margin: 6px 0 0; color: var(--texte-2); font-size: 14px; }
.jeu .bas { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 2px; }
.jeu .progres { min-width: 0; font-size: 14px; color: var(--texte); overflow-wrap: anywhere; }
.jeu .progres small { display: block; margin-top: 1px; color: var(--texte-2); font-size: 12.5px; }
.jeu .jouer { flex: 0 0 auto; min-height: 44px; padding: 0 20px; border-radius: 999px; display: inline-flex; align-items: center; background: var(--beurre); box-shadow: 0 4px 0 var(--beurre-sombre); font: 700 17px/1 var(--titre); }
.jeu.bientot { background: transparent; box-shadow: none; border: 3px dashed #D9CCF5; }
.jeu.bientot .vignette { background: var(--lavande-pale); color: var(--lavande); font: 700 34px/1 var(--titre); }
.jeu.bientot h3 { color: var(--texte-2); }
.pied { margin: 26px 4px 0; color: var(--texte-2); font-size: 13px; text-align: center; }
.pied b { color: var(--texte); }
@media (prefers-reduced-motion: reduce) { .jeu { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <img src="icons/accueil.svg" alt="" width="60" height="60">
    <div><h1>Salle de jeux</h1><p>Des petits jeux pour le téléphone, à jouer quand tu veux.</p></div>
  </header>
  <h2 id="titre-jeux">Les jeux</h2>
  <section id="jeux" aria-labelledby="titre-jeux"></section>
  <p class="pied">Chaque partie est enregistrée sur ce téléphone.<br><b>Pour l’installer</b> : Partager → « Sur l’écran d’accueil » sur iPhone, menu ⋮ → « Installer l’application » sur Android.</p>
</main>
<script>
(() => {
  'use strict';
  // ─── la liste des jeux : pour en ajouter un, un dossier à son nom et une entrée ici ───
  const JEUX = [
    { id: 'fournil', nom: 'Le Fournil', genre: 'Boulangerie en 3D', pitch: 'Cuis, vends, embauche des apprentis : ta boulangerie tourne même quand tu n’es pas là.', url: 'fournil/', icone: 'icons/icon.svg', fond: '#FFF1D6', progres: progresFournil },
    { bientot: true, nom: 'Bientôt un nouveau jeu', pitch: 'Il s’installera ici, à côté du Fournil.' },
  ];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ilYA = (ms) => { const s = Math.max(0, (Date.now() - ms) / 1000); return s < 120 ? 'à l’instant' : s < 3600 ? `il y a ${Math.round(s / 60)} min` : s < 86400 ? `il y a ${Math.round(s / 3600)} h` : `il y a ${Math.round(s / 86400)} j`; };
  // la partie du Fournil, lue dans sa sauvegarde (même domaine : localStorage partagé)
  function progresFournil() {
    try {
      const s = JSON.parse(localStorage.getItem('fournil.v2') || 'null');
      if (!s || s.v !== 2 || !Array.isArray(s.stations)) return null;
      return { titre: s.nomBoutique || 'Ta boulangerie', sous: `Boutique n°${s.boutiques || 1} · ${s.etoiles || 0} ★${s.lastSeen ? ` · ${ilYA(s.lastSeen)}` : ''}` };
    } catch (e) { return null; }
  }
  const box = document.getElementById('jeux');
  box.innerHTML = JEUX.map((j) => {
    if (j.bientot) return `<div class="jeu bientot" aria-disabled="true"><div class="vignette" aria-hidden="true">?</div><div><h3>${esc(j.nom)}</h3><p>${esc(j.pitch)}</p></div></div>`;
    const p = j.progres ? j.progres() : null;
    return `<a class="jeu" href="${esc(j.url)}" data-jeu="${esc(j.id)}" style="--fond:${j.fond}">
      <div class="vignette"><img src="${esc(j.icone)}" alt="" width="64" height="64"></div>
      <div><h3>${esc(j.nom)}</h3><span class="genre">${esc(j.genre)}</span><p>${esc(j.pitch)}</p></div>
      <div class="bas"><span class="progres">${p ? `${esc(p.titre)}${p.sous ? `<small>${esc(p.sous)}</small>` : ''}` : 'Nouvelle partie'}</span><span class="jouer">${p ? 'Continuer' : 'Jouer'}</span></div>
    </a>`;
  }).join('');
  // hors ligne : un service worker pour l'accueil (chaque jeu a le sien dans son dossier)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    let top = false; try { top = window.self === window.top; } catch (e) { top = false; }
    if (top) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
