# Le Fournil : le classement en ligne éprouvé pour de vrai.
# « SQL » : supabase/fournil-classement.sql collé dans un vrai Postgres local (PGlite, Postgres en WebAssembly, installé à part,
#           jamais dans le dépôt), puis chaque fonction jouée en tant qu'anon, avec le temps simulé (semaines, heure d'été / d'hiver).
# « Supabase réel » : les fonctions installées sur le projet Supabase du jeu, appelées comme le fait le téléphone (clé PUBLIQUE de
#           fournil/config.js) ; deux joueurs de test « test-ci-… », puis quelques autres pour sonder la limite d'inscriptions par
#           source (12 au plus), tous retirés à la fin. Le conteneur de Claude n'a pas accès à Supabase : ce test tourne ici.
# À la main (onglet Actions → Classement → Run workflow) ou à chaque push sur la branche classement-test. Aucun secret nécessaire.
name: Classement
on:
  push:
    branches: [classement-test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: classement
  cancel-in-progress: false # on laisse finir le test en cours : il retire ses joueurs de test avant de s'arrêter
jobs:
  sql:
    name: SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PGlite (Postgres en WebAssembly), version exacte, hors du dépôt
        run: npm install --prefix "$RUNNER_TEMP/pglite" --no-save --no-package-lock --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Le SQL du classement, fonction par fonction, en tant qu'anon
        run: node test/fournil-classement-sql.cjs "$RUNNER_TEMP/pglite"
  supabase:
    name: Supabase réel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Le classement sur le projet Supabase du jeu (joueurs de test, tous retirés à la fin)
        run: node test/fournil-classement-ci.cjs
