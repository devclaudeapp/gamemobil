# Met le jeu en ligne sur GitHub Pages à chaque push sur master.
name: Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Le Fournil sur la vraie page, dans Chromium : la triche au changement d'heure (téléphone avancé, hors ligne, fuseau changé,
  # réseau qui revient), les récompenses du podium, le classement en points de boulanger (Supabase simulé : rien ne part vers le
  # vrai projet ; l'icône ronde en haut à droite), l'Atelier (ses trois mini-jeux joués au doigt, records, gains et plafond du jour)
  # et l'arrière-salle (le BlackJack caché : la porte touchée cinq fois, les mises, le tapis, aucune incidence sur la fortune) ;
  # les copains et les notifications (visite d'une boutique, pourboires, objectif commun ; abonnement Web Push simulé, service worker) ;
  # les compagnons (la feuille, l'achat avec l'argent du jeu, le modèle 3D, la caresse, sans fuite ni allocation) ;
  # la mise à jour (le bandeau « Nouvelle version du Fournil » quand version.json change, jamais en cache).
  # Rouge ici = pas de mise en ligne.
  fournil:
    name: Le Fournil (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: La triche au changement d'heure, les récompenses, le classement, l'Atelier, la garde-robe
        run: |
          node build.js
          node test/fournil-points.test.js
          node test/fournil-triche.cjs
          node test/fournil-recompenses.cjs
          node test/fournil-classement.cjs
          node test/fournil-atelier.test.js
          node test/fournil-atelier.cjs
          node test/fournil-garderobe.test.js
          node test/fournil-garderobe.cjs
          node test/fournil-absence.test.js
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_RECOMPENSES: '8861'
          PORT_CLASSEMENT: '8862'
          PORT_ATELIER: '8863'
          PORT_GARDEROBE: '8864'
          PORT_QUARTIER: '8865'
          PORT_BLACKJACK: '8866'
          PORT_NOTIFS: '8867'
          PORT_COMPAGNONS: '8868'
          PORT_VERSION: '8869'
  # Deux tâches en parallèle : une seule dépassait les 20 minutes.
  fournil2:
    name: Le Fournil, événements (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      # test/fournil-quartier.cjs (l'écran de la Planque) : écarté avec la Planque le 27 oct., à remettre à son retour (QUARTIER.ECARTE, src/quartier.js) ;
      # ses règles (fournil-quartier.test.js, Node) restent testées
      - name: Les règles du Quartier, la Maison hantée (ses activités, son annonce et sa vidéo)
        run: |
          node build.js
          node test/fournil-quartier.test.js
          node test/fournil-hantee.test.js
          node test/fournil-hantee.cjs
          node test/fournil-hantee-activites.cjs
          node test/fournil-hantee-annonce.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_RECOMPENSES: '8861'
          PORT_CLASSEMENT: '8862'
          PORT_ATELIER: '8863'
          PORT_GARDEROBE: '8864'
          PORT_QUARTIER: '8865'
          PORT_BLACKJACK: '8866'
          PORT_MEUBLES: '8870'
          PORT_HANTEE_ACTIVITES: '8881'
          PORT_HANTEE_ANNONCE: '8883'
  # Une troisième tâche en parallèle (la première dépassait les 20 minutes) : les notifications, le réveil, les compagnons, la mise à jour, le chat, les nouveautés,
  # les recettes de boutique et le parcours du boulanger.
  fournil6:
    name: Le Fournil, arrière-salle, HD et sons (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: L'arrière-salle, la HD, les sons
        run: |
          node build.js
          node test/fournil-blackjack.test.js
          node test/fournil-roulette.test.js
          node test/fournil-casino.test.js
          node test/fournil-blackjack.cjs
          node test/fournil-roulette.cjs
          node test/fournil-hd.cjs
          node test/fournil-sons.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_RECOMPENSES: '8861'
          PORT_CLASSEMENT: '8862'
          PORT_ATELIER: '8863'
          PORT_GARDEROBE: '8864'
          PORT_QUARTIER: '8865'
          PORT_BLACKJACK: '8866'
          PORT_MEUBLES: '8870'
          PORT_HANTEE_ACTIVITES: '8881'
  # Une troisième tâche en parallèle (la première dépassait les 20 minutes) : les notifications, le réveil, les compagnons, la mise à jour, le chat, les nouveautés,
  # les recettes de boutique et le parcours du boulanger.
  fournil3:
    name: Le Fournil, notifications, réveil, compagnons, mise à jour, chat, nouveautés, idées et votes (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Les notifications, le réveil, les compagnons, la mise à jour, le chat, les nouveautés, les idées et les votes
        run: |
          node build.js
          node test/fournil-notifs.cjs
          node test/fournil-reveil.cjs
          node test/fournil-compagnons.test.js
          node test/fournil-compagnons.cjs
          node test/fournil-version.cjs
          node test/fournil-chat.cjs
          node test/fournil-nouveautes.cjs
          node test/fournil-retours.cjs
          node test/fournil-recettes-boutique.test.js
          node test/fournil-recettes-boutique.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_NOTIFS: '8867'
          PORT_COMPAGNONS: '8868'
          PORT_VERSION: '8869'
          PORT_RECETTES: '8873'
          PORT_CHAT: '8870'
          PORT_NOUVEAUTES: '8871'
          PORT_RETOURS: '8872'
  # Une quatrième tâche en parallèle (fournil2 prend déjà plus de 17 minutes sur 20) : le standing des boutiques (12 décors, en haute et
  # en éco, le soir, Noël, un téléphone 360 × 640) et « tout déplaçable » (au doigt) ; la batterie (30 images/s en jouant, 10 au repos, mêmes gains).
  fournil4:
    name: Le Fournil, standing des boutiques, aménagement et batterie (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Le standing des boutiques, l'aménagement libre et la batterie
        run: |
          node build.js
          node test/fournil-standing.cjs
          node test/fournil-amenage.cjs
          node test/fournil-batterie.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_STANDING: '8874'
          PORT_AMENAGE: '8875'
          PORT_BATTERIE: '8876'
  # Une cinquième tâche en parallèle : les clients 3D de la boutique (src/clients3d.js), en qualité haute (leur lot, la vie image par image,
  # les replis, la visite d'un copain, les allers-retours avec la Maison hantée, le processeur ralenti ×4) : une douzaine de minutes à elle seule.
  fournil5:
    name: Le Fournil, clients 3D, personnages et meubles (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Les clients 3D, les personnages, les meubles de la salle
        run: |
          node build.js
          node test/fournil-clients3d.cjs
          node test/fournil-persos.cjs
          node test/fournil-meubles.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_CLIENTS3D: '8877'
          PORT_MEUBLES: '8870'
  # Deux tâches de plus pour « Ma chaîne de boutiques », chacune bien sous les 25 minutes : l'écran « Ma chaîne » (entrer dans une boutique de la
  # chaîne, les jetons, les gérants, la boulangerie qui ne bouge pas) et la version d'essai (ses clés à elle, la vraie partie jamais touchée,
  # aucun service worker ni requête au serveur) ; puis « Mes décos » (le budget d'appels de dessin avec six décos posées) et la petite planète.
  fournil7:
    name: Le Fournil, Ma chaîne et la version d'essai (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Ma chaîne de boutiques, la version d'essai
        run: |
          node build.js
          node build.js --essai
          node test/fournil-chaine.test.js
          node test/fournil-chaine.cjs
          node test/fournil-essai.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_CHAINE: '8890'
          PORT_ESSAI: '8879'
  fournil8:
    name: Le Fournil, Mes décos et la petite planète (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Mes décos, la petite planète
        run: |
          node build.js
          node test/fournil-decos.cjs
          node test/fournil-planete.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_DECOS: '8891'
          PORT_PLANETE: '8878'
  deploy:
    needs: [fournil, fournil2, fournil3, fournil4, fournil5, fournil6, fournil7, fournil8]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # La version d'essai (fournil-essai/, à côté du vrai jeu) : construite depuis la branche du lot en cours, à chaque déploiement (un
      # déploiement Pages remplace tout le site). Vide quand le lot est fusionné dans master : plus de version d'essai.
      ESSAI_BRANCHE: chaine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: node build.js && node test/econ.test.js && node test/longevite.js --test && node test/poncin.test.js && node test/fournil-classement.test.js && node test/fournil-horloge.test.js && node test/fournil-atelier.test.js && node test/fournil-points.test.js && node test/fournil-quartier.test.js && node test/fournil-hantee.test.js && node test/fournil-absence.test.js && node test/fournil-blackjack.test.js && node test/fournil-roulette.test.js && node test/fournil-casino.test.js && node test/fournil-compagnons.test.js && node test/fournil-recettes-boutique.test.js && node test/fournil-garderobe.test.js && node test/fournil-chaine.test.js && node test/fournil-chaine-sim.js --court --test
        env:
          TZ: Europe/Paris
      # La version d'essai : la branche du lot, construite à part (node build.js --essai n'écrit que fournil-essai/), testée, puis posée à
      # côté du vrai jeu. Le vrai jeu reste celui de master, construit et testé plus haut. Une branche d'essai cassée ne bloque jamais sa
      # mise en ligne (continue-on-error) : l'essai manque simplement à ce déploiement.
      - name: La version d'essai (la branche du lot, à côté du vrai jeu)
        if: ${{ env.ESSAI_BRANCHE != '' }}
        continue-on-error: true
        env:
          TZ: Europe/Paris
        run: |
          trap 'git worktree remove --force _essai 2>/dev/null; rm -rf _essai' EXIT
          git fetch --depth 1 origin "$ESSAI_BRANCHE" && git worktree add _essai FETCH_HEAD
          (cd _essai && node build.js --essai && node test/econ.test.js && node test/longevite.js --test && node test/fournil-chaine.test.js)
          rm -rf fournil-essai && mv _essai/fournil-essai fournil-essai
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
