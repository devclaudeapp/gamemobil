# Met le jeu en ligne sur GitHub Pages à chaque push sur master.
name: Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Le Fournil sur la vraie page, dans Chromium : la triche au changement d'heure (téléphone avancé, hors ligne, fuseau changé,
  # réseau qui revient), les récompenses du podium, le classement en points de boulanger (Supabase simulé : rien ne part vers le
  # vrai projet ; l'icône ronde en haut à droite), l'Atelier (ses trois mini-jeux joués au doigt, records, gains et plafond du jour)
  # et l'arrière-salle (le BlackJack caché : la porte touchée cinq fois, les mises, le tapis, aucune incidence sur la fortune) ;
  # les copains et les notifications (visite d'une boutique, pourboires, objectif commun ; abonnement Web Push simulé, service worker) ;
  # les compagnons (la feuille, l'achat avec l'argent du jeu, le modèle 3D, la caresse, sans fuite ni allocation) ;
  # la mise à jour (le bandeau « Nouvelle version du Fournil » quand version.json change, jamais en cache).
  # Rouge ici = pas de mise en ligne.
  fournil:
    name: Le Fournil (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: La triche au changement d'heure, les récompenses, le classement, l'Atelier, la garde-robe
        run: |
          node build.js
          node test/fournil-points.test.js
          node test/fournil-triche.cjs
          node test/fournil-recompenses.cjs
          node test/fournil-classement.cjs
          node test/fournil-atelier.test.js
          node test/fournil-atelier.cjs
          node test/fournil-garderobe.test.js
          node test/fournil-garderobe.cjs
          node test/fournil-absence.test.js
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_RECOMPENSES: '8861'
          PORT_CLASSEMENT: '8862'
          PORT_ATELIER: '8863'
          PORT_GARDEROBE: '8864'
          PORT_QUARTIER: '8865'
          PORT_BLACKJACK: '8866'
          PORT_NOTIFS: '8867'
          PORT_COMPAGNONS: '8868'
          PORT_VERSION: '8869'
  # Deux tâches en parallèle : une seule dépassait les 20 minutes. Les activités du Manoir (près de 30 minutes à elles seules) ont leur
  # tâche, fournil9 : ensemble, elles en prenaient 42.
  fournil2:
    name: Le Fournil, événements (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      # test/fournil-quartier.cjs (l'écran de la Planque) : écarté avec la Planque le 27 oct., à remettre à son retour (QUARTIER.ECARTE, src/quartier.js) ;
      # ses règles (fournil-quartier.test.js, Node) restent testées
      - name: Les règles du Quartier, la Maison hantée (son annonce et sa vidéo)
        run: |
          node build.js
          node test/fournil-quartier.test.js
          node test/fournil-hantee.test.js
          node test/fournil-hantee.cjs
          node test/fournil-hantee-annonce.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_RECOMPENSES: '8861'
          PORT_CLASSEMENT: '8862'
          PORT_ATELIER: '8863'
          PORT_GARDEROBE: '8864'
          PORT_QUARTIER: '8865'
          PORT_BLACKJACK: '8866'
          PORT_MEUBLES: '8870'
          PORT_HANTEE_ACTIVITES: '8881'
          PORT_HANTEE_ANNONCE: '8883'
  # Une troisième tâche en parallèle (la première dépassait les 20 minutes) : les notifications, le réveil, les compagnons, la mise à jour, le chat, les nouveautés,
  # les recettes de boutique et le parcours du boulanger.
  fournil6:
    name: Le Fournil, arrière-salle, HD et sons (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: L'arrière-salle, la HD, les sons
        run: |
          node build.js
          node test/fournil-blackjack.test.js
          node test/fournil-roulette.test.js
          node test/fournil-casino.test.js
          node test/fournil-blackjack.cjs
          node test/fournil-roulette.cjs
          node test/fournil-hd.cjs
          node test/fournil-sons.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_RECOMPENSES: '8861'
          PORT_CLASSEMENT: '8862'
          PORT_ATELIER: '8863'
          PORT_GARDEROBE: '8864'
          PORT_QUARTIER: '8865'
          PORT_BLACKJACK: '8866'
          PORT_MEUBLES: '8870'
          PORT_HANTEE_ACTIVITES: '8881'
  # Une troisième tâche en parallèle (la première dépassait les 20 minutes) : les notifications, le réveil, les compagnons, la mise à jour, le chat, les nouveautés,
  # les recettes de boutique et le parcours du boulanger.
  fournil3:
    name: Le Fournil, notifications, réveil, compagnons, mise à jour, chat, nouveautés, idées et votes (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Les notifications, le réveil, les compagnons, la mise à jour, le chat, les nouveautés, les idées et les votes
        run: |
          node build.js
          node test/fournil-notifs.cjs
          node test/fournil-reveil.cjs
          node test/fournil-compagnons.test.js
          node test/fournil-compagnons.cjs
          node test/fournil-version.cjs
          node test/fournil-chat.cjs
          node test/fournil-nouveautes.cjs
          node test/fournil-retours.cjs
          node test/fournil-recettes-boutique.test.js
          node test/fournil-recettes-boutique.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_NOTIFS: '8867'
          PORT_COMPAGNONS: '8868'
          PORT_VERSION: '8869'
          PORT_RECETTES: '8873'
          PORT_CHAT: '8870'
          PORT_NOUVEAUTES: '8871'
          PORT_RETOURS: '8872'
  # Une quatrième tâche en parallèle (fournil2 prend déjà plus de 17 minutes sur 20) : le standing des boutiques (12 décors, en haute et
  # en éco, le soir, Noël, un téléphone 360 × 640) et « tout déplaçable » (au doigt) ; la batterie (30 images/s en jouant, 10 au repos, mêmes gains).
  fournil4:
    name: Le Fournil, standing des boutiques, aménagement et batterie (Playwright)
    runs-on: ubuntu-latest
    # 20 minutes d'habitude, mais plus de 30 sur un runner lent (tout passait, coupé au dernier test).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Le standing des boutiques, l'aménagement libre et la batterie
        run: |
          node build.js
          node test/fournil-standing.cjs
          node test/fournil-amenage.cjs
          node test/fournil-batterie.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_STANDING: '8874'
          PORT_AMENAGE: '8875'
          PORT_BATTERIE: '8876'
  # Une cinquième tâche en parallèle : les clients 3D de la boutique (src/clients3d.js), en qualité haute (leur lot, la vie image par image,
  # les replis, la visite d'un copain, les allers-retours avec la Maison hantée, le processeur ralenti ×4) : une douzaine de minutes à elle seule.
  fournil5:
    name: Le Fournil, clients 3D, personnages et meubles (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Les clients 3D, les personnages, les meubles de la salle
        run: |
          node build.js
          node test/fournil-clients3d.cjs
          node test/fournil-persos.cjs
          node test/fournil-meubles.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_CLIENTS3D: '8877'
          PORT_MEUBLES: '8870'
  # Deux tâches de plus pour « Ma chaîne de boutiques », chacune bien sous les 25 minutes : l'écran « Ma chaîne » (entrer dans une boutique de la
  # chaîne, les jetons, les gérants, la boulangerie qui ne bouge pas) et la version d'essai (ses clés à elle, la vraie partie jamais touchée,
  # aucun service worker ni requête au serveur) ; puis « Mes décos » (le budget d'appels de dessin avec six décos posées ; ses vignettes : l'arrière-salle
  # cachée tant qu'on ne l'a pas trouvée, le cache du service worker, hors ligne et fichier manquant sans erreur, le repli au style d'avant) et la petite planète.
  fournil7:
    name: Le Fournil, Ma chaîne et la version d'essai (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Ma chaîne de boutiques, la version d'essai
        run: |
          node build.js
          node build.js --essai
          node test/fournil-chaine.test.js
          node test/fournil-chaine.cjs
          node test/fournil-essai.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_CHAINE: '8890'
          PORT_ESSAI: '8879'
  fournil8:
    name: Le Fournil, Mes décos et la petite planète (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Mes décos et ses vignettes, la petite planète
        run: |
          node build.js
          node test/fournil-decos.cjs
          node test/fournil-vignettes.cjs
          node test/fournil-planete.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_DECOS: '8891'
          PORT_VIGNETTES: '8893'
          PORT_PLANETE: '8878'
  # Les activités de la Maison hantée (jouées au doigt dans le Manoir, en haute puis en éco) : près de 30 minutes, seules.
  fournil9:
    name: Le Fournil, les activités du Manoir (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Les activités de la Maison hantée
        run: |
          node build.js
          node test/fournil-hantee-activites.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_HANTEE_ACTIVITES: '8881'
  # L'accueil des nouveaux joueurs (docs/accueil-contrat.md) : les premiers pas guidés, la carte « Ton premier jour » et sa récompense, les
  # déblocages et leurs annonces, une vieille sauvegarde qui garde tout, l'interrupteur, le 360 × 640 (seul : fournil4 est près de sa limite)
  fournil12:
    name: Le Fournil, l'accueil des nouveaux joueurs (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: L'accueil des nouveaux joueurs
        run: |
          node build.js
          node test/fournil-accueil.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_ACCUEIL: '8897'
  # Le boulanger et les apprentis en personnages 3D (src/equipe3d.js) : leur lot après celui des clients, la préparation à petits pas, la vie
  # image par image, les 42 tenues (traversées, budgets, cache, mémoire), la vue « Mon boulanger », la HD coupée, la Maison hantée, l'éco, un
  # fichier manquant, le processeur ralenti ×4 : une dizaine de minutes à lui seul ; fournil5 (les clients 3D, une douzaine) n'avait plus la place.
  fournil10:
    name: Le Fournil, le boulanger et les apprentis en 3D (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Le boulanger et les apprentis en 3D
        run: |
          node build.js
          node test/fournil-equipe3d.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_EQUIPE3D: '8892'
  # Le lot « progression » (src/ui.js) : les paliers après la n°30 (le rattrapage d'une sauvegarde n°47, le défi de palier et sa soupape,
  # l'annonce), le second (sa feuille, ses achats pendant le jeu), les trophées dorés et secrets, le concours des boulangeries rivales (et
  # la visite d'une rivale), le chantier du quartier avec et sans le SQL v6.8, 390 × 844 et 360 × 640 : quelques minutes.
  fournil11:
    name: Le Fournil, paliers, second, trophées, concours et chantiers (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Les paliers, le second, les trophées, le concours et les chantiers
        run: |
          node build.js
          node test/fournil-progression.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_PROGRESSION: '8894'
  # Dernier Rempart (zombies/) : ses règles pures dans Node (données, monde, vagues, atelier, armes, la navigation de Poncin réutilisée, un
  # joueur automatique sur chaque arène), puis de bout en bout sur un iPhone simulé (carte de la Salle de jeux, titre, joystick, vague,
  # tourelle, pause, fin et record, portrait, hors ligne par le service worker), puis la coop à deux pages (salon local). Une tâche à part.
  zombies:
    name: Dernier Rempart (Node et Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright et Chromium (hors du dépôt)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Les règles, puis le jeu au doigt
        run: |
          node build.js
          node test/zombies.test.js
          node test/zombies-play.cjs
          node test/zombies-coop.cjs
          node test/zombies-defi.cjs
        env:
          TZ: Europe/Paris
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          PORT_ZOMBIES: '8894'
          PORT_ZOMBIES_COOP: '8895'
          PORT_ZOMBIES_DEFI: '8896'
      - name: Le SQL du classement du défi, dans un vrai Postgres (PGlite)
        run: |
          npm install --prefix "$RUNNER_TEMP/pglite" --no-save --no-package-lock --no-audit --no-fund @electric-sql/pglite@0.5.8
          node test/zombies-defi-sql.cjs "$RUNNER_TEMP/pglite"
  deploy:
    needs: [fournil, fournil2, fournil3, fournil4, fournil5, fournil6, fournil7, fournil8, fournil9, fournil10, fournil11, fournil12, zombies]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # La version d'essai (fournil-essai/, à côté du vrai jeu) : construite depuis la branche du lot en cours, à chaque déploiement (un
      # déploiement Pages remplace tout le site). Vide quand le lot est fusionné dans master : plus de version d'essai.
      # « Ma chaîne de boutiques » (branche chaine) est en ligne pour tous depuis le 28 oct. : vide. Pour le prochain lot, y mettre sa
      # branche (et la même dans essai.yml) ; l'étape plus bas et essai.yml restent prêtes.
      ESSAI_BRANCHE: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: node build.js && node test/econ.test.js && node test/longevite.js --test && node test/poncin.test.js && node test/fournil-classement.test.js && node test/fournil-horloge.test.js && node test/fournil-atelier.test.js && node test/fournil-points.test.js && node test/fournil-quartier.test.js && node test/fournil-hantee.test.js && node test/fournil-absence.test.js && node test/fournil-blackjack.test.js && node test/fournil-roulette.test.js && node test/fournil-casino.test.js && node test/fournil-compagnons.test.js && node test/fournil-recettes-boutique.test.js && node test/fournil-progression.test.js && node test/fournil-accueil.test.js && node test/fournil-garderobe.test.js && node test/fournil-chaine.test.js && node test/fournil-chaine-sim.js --court --test && node test/fournil-vignettes.test.js && node test/zombies.test.js
        env:
          TZ: Europe/Paris
      # La version d'essai : la branche du lot, construite à part (node build.js --essai n'écrit que fournil-essai/), testée, puis posée à
      # côté du vrai jeu. Le vrai jeu reste celui de master, construit et testé plus haut. Une branche d'essai cassée ne bloque jamais sa
      # mise en ligne (continue-on-error) : l'essai manque simplement à ce déploiement.
      - name: La version d'essai (la branche du lot, à côté du vrai jeu)
        if: ${{ env.ESSAI_BRANCHE != '' }}
        continue-on-error: true
        env:
          TZ: Europe/Paris
        run: |
          trap 'git worktree remove --force _essai 2>/dev/null; rm -rf _essai' EXIT
          git fetch --depth 1 origin "$ESSAI_BRANCHE" && git worktree add _essai FETCH_HEAD
          (cd _essai && node build.js --essai && node test/econ.test.js && node test/longevite.js --test && node test/fournil-progression.test.js && node test/fournil-accueil.test.js && node test/fournil-chaine.test.js)
          rm -rf fournil-essai && mv _essai/fournil-essai fournil-essai
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
