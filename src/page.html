<div id="probe" aria-hidden="true"></div>
<header id="haut">
  <div class="solde">

    <div><b id="coins">0 €</b><small id="taux">—</small></div>
  </div>

  </div>
</header>
<canvas id="scene" aria-label="La boutique : les clients entrent, achètent et repartent."></canvas>
<main id="liste">
  <div class="barre-achat">
    <div class="modes" role="group" aria-label="Quantité à acheter">
      <button type="button" data-mode="1" class="actif">×1</button><button type="button" data-mode="10">×10</button><button type="button" data-mode="100">×100</button><button type="button" data-mode="max">Max</button>
    </div>
    <button id="b-ameliorations" class="btn-am" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.8 5.6L19.5 9l-5.7 1.4L12 16l-1.8-5.6L4.5 9l5.7-1.4z" fill="#fff"/><path d="M19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9z" fill="#fff"/></svg>Bonus</button>
  </div>
  <div id="evenement" hidden></div>
  <button id="objectifs" class="obj" type="button" aria-label="Objectifs du jour"></button>
  <div id="cartes"></div>
</main>
