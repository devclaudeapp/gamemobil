<div id="corps">
  <div id="scene-wrap">

  </div>
  <div id="tiroir" data-pos="mi">

    <button id="objectifs" class="ticket" type="button" aria-label="Objectifs du jour"></button>
    <div id="cartes"></div>
  </section>
  <section class="page" id="page-defis" data-page="defis" hidden></section>
  <section class="page" id="page-boulanger" data-page="boulanger" hidden></section>
  <section class="page" id="page-journal" data-page="journal" hidden></section>
  <section class="page" id="page-reglages" data-page="reglages" hidden></section>
    </main>
  </div>
</div>
