<title>Œillets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Text:wght@700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:opsz,wght@10..72,700;10..72,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* ŒILLETS — carnet de paludier imprimé en risographie : trois encres en aplat sur kraft. Une seule page, portrait, sans défilement. */
:root {
  --papier: #F1E8D6; --encre: #2A2B33; --canard: #1F8A8A; --rose: #F26BA6; --violet: #6B5B95; --argile: #8E7D6D; --soleil: #F7C843; --sel: #FFFDF6;
  --encre-pale: #6E6A6B;
  --pochoir: "Big Shoulders Stencil Text", "Big Shoulders Stencil", "Arial Narrow", Impact, "Helvetica Neue", sans-serif;
  --etiquette: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --carnet: "Instrument Serif", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--papier); color: var(--encre); }
body {
  font: 400 15px/1.35 var(--etiquette); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--soleil); outline-offset: 2px; }
#probe { position: fixed; left: -9999px; top: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#marais { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--papier); }
.pochoir { font-family: var(--pochoir); font-weight: 900; letter-spacing: .02em; font-variant-numeric: tabular-nums; text-transform: uppercase; }
.etq { font-family: var(--etiquette); }
.carnet-i { font-family: var(--carnet); font-style: italic; }

/* ─── bande de ciel (textes) ─── */
#ciel { position: fixed; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none; padding: calc(env(safe-area-inset-top, 0px) + 8px) 14px 0;
  display: grid; grid-template-columns: 1fr auto 1fr; column-gap: 8px; align-items: start; }
#ciel .col { display: flex; flex-direction: column; gap: 0; min-width: 0; }
#ciel .col.d { text-align: right; align-items: flex-end; }
#ciel .big { font: 900 34px/1 var(--pochoir); font-variant-numeric: tabular-nums; letter-spacing: .01em; white-space: nowrap; }
#ciel .big small { font-size: 20px; margin-left: 2px; }
#ciel .lig { font-size: 13px; line-height: 1.3; color: var(--encre); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 44vw; }
#ciel .lig b { font-weight: 600; }
#ciel .lig.pale { color: var(--encre-pale); }
#maree-txt { font: 700 13px/1.3 var(--pochoir); letter-spacing: .06em; }
#maree-txt b { font-size: 15px; }
#bandeau { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); transform: translateX(-50%); z-index: 3; pointer-events: none; text-align: center; padding: 4px 12px; background: var(--soleil); color: var(--encre);
  font: 700 12px/1.25 var(--pochoir); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; border: 2px solid var(--encre); box-shadow: 2px 2px 0 var(--encre); }

/* ─── marge et barre ─── */
#marge { position: fixed; left: 0; right: 0; z-index: 2; margin: 0; padding: 4px 18px; pointer-events: none; text-align: center; min-height: 44px;
  display: flex; align-items: center; justify-content: center; }
#marge em { font: italic 400 clamp(16px, 4.6vw, 19px)/1.25 var(--carnet); color: var(--encre); text-wrap: balance; }
#marge em.dicton { color: var(--encre-pale); }
#marge em.action { pointer-events: auto; text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
#barre { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  padding: 6px 12px calc(env(safe-area-inset-bottom, 0px) + 8px); background: transparent; border-top: 2px solid var(--encre); }
#barre button { min-height: 46px; border: 2px solid var(--encre); background: transparent; font: 700 13px/1 var(--pochoir); letter-spacing: .12em; text-transform: uppercase;
  box-shadow: 2px 2px 0 var(--encre); position: relative; }
#barre button:active, #barre button.actif { background: var(--encre); color: var(--papier); box-shadow: none; transform: translate(2px, 2px); }
#barre button.anneau::after { content: ""; position: absolute; inset: -8px; border: 3px solid var(--soleil); border-radius: 999px; pointer-events: none; }
#barre button b { display: block; font: 400 11px/1 var(--etiquette); letter-spacing: .02em; text-transform: none; margin-top: 3px; color: inherit; opacity: .8; }

/* ─── feuille basse et pages ─── */
#voile { position: fixed; inset: 0; z-index: 7; background: rgba(42, 43, 51, .18); }
#feuille { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; max-height: 78%; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  background: var(--papier); border-top: 2px solid var(--encre); box-shadow: 0 -2px 0 var(--papier), 0 -4px 0 var(--encre);
  padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 16px); animation: monte .2s steps(2, end); }
#feuille .poignee { width: 48px; height: 4px; margin: 0 auto 10px; background: var(--encre); }
#page { position: fixed; inset: 0; z-index: 6; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; background: var(--papier);
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px); }
#page .inner, #feuille .inner { max-width: 520px; margin: 0 auto; }
@keyframes monte { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

h1.titre { margin: 0; font: 900 clamp(44px, 15.5vw, 96px)/.9 var(--pochoir); letter-spacing: -.02em; text-transform: uppercase; }
h2 { margin: 0 0 6px; font: 900 26px/1 var(--pochoir); letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; }
h3 { margin: 16px 0 6px; font: 700 12px/1.3 var(--pochoir); letter-spacing: .16em; text-transform: uppercase; color: var(--encre-pale); }
.sur { margin: 0 0 4px; font: 700 12px/1.3 var(--pochoir); letter-spacing: .16em; text-transform: uppercase; color: var(--encre-pale); }
.sur.canard { color: var(--canard); }
p { margin: 6px 0; }
.ital { font: italic 400 17px/1.3 var(--carnet); }
.pale { color: var(--encre-pale); }
.ligne { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(42, 43, 51, .18); }
.ligne:last-child { border-bottom: 0; }
.ligne .val { font: 700 17px/1 var(--pochoir); font-variant-numeric: tabular-nums; white-space: nowrap; }
.etiquette { display: inline-block; padding: 3px 8px; background: var(--soleil); border: 2px solid var(--encre); font: 700 13px/1.2 var(--pochoir); letter-spacing: .06em;
  text-transform: uppercase; font-variant-numeric: tabular-nums; }
.etiquette.grande { font-size: 18px; padding: 6px 12px; box-shadow: 2px 2px 0 var(--encre); }
.tampon { display: inline-block; transform: rotate(-2deg); padding: 6px 10px; border: 3px solid var(--rose); color: var(--rose); font: 900 20px/1 var(--pochoir);
  letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.btn { display: block; width: 100%; min-height: 48px; padding: 10px 14px; margin-top: 10px; border: 2px solid var(--encre); background: var(--papier);
  font: 700 14px/1.2 var(--pochoir); letter-spacing: .1em; text-transform: uppercase; text-align: center; box-shadow: 2px 2px 0 var(--encre); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.plein { background: var(--encre); color: var(--papier); }
.btn.jaune { background: var(--soleil); }
.btn[disabled] { opacity: .45; box-shadow: none; cursor: default; }
.btn.petit { display: inline-block; width: auto; min-height: 44px; padding: 10px 12px; font-size: 12px; margin-top: 0; }
.rang { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.rang > .btn { flex: 1; }
.liste { list-style: none; margin: 0; padding: 0; }
.liste li { padding: 8px 0; border-bottom: 1px solid rgba(42, 43, 51, .18); }
.liste li:last-child { border-bottom: 0; }
.trappe { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.trappe span { flex: 1; min-width: 0; }
.trappe .btn.petit { min-width: 92px; }
.choix { display: grid; gap: 8px; margin-top: 8px; }
.choix button { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; text-align: left; padding: 10px 12px; border: 2px solid var(--encre);
  background: var(--papier); box-shadow: 2px 2px 0 var(--encre); }
.choix button:active { transform: translate(2px, 2px); box-shadow: none; }
.choix button.non { box-shadow: none; border-color: var(--argile); color: var(--encre-pale); }
.choix button.non .nom { text-decoration: line-through; text-decoration-thickness: 2px; }
.choix .nom { font: 700 16px/1.1 var(--pochoir); letter-spacing: .06em; text-transform: uppercase; }
.choix .pourquoi { grid-column: 1 / -1; font-size: 13px; line-height: 1.3; }
.choix .pourquoi.conseil { font: italic 400 14px/1.3 var(--carnet); color: var(--encre-pale); }
.choix .pourquoi.rouge { color: var(--encre); }
.choix .pourquoi.rouge::before { content: "— "; }
.glyphes { font-size: 22px; letter-spacing: .12em; line-height: 1.4; word-break: break-all; color: var(--canard); }
.sacs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 8px; }
.sac { padding: 12px 10px 14px; border: 2px solid var(--argile); background: color-mix(in srgb, var(--argile) 16%, var(--papier)); color: var(--encre); text-align: center; position: relative; }
.sac::before { content: ""; position: absolute; left: 10px; right: 10px; top: 6px; border-top: 2px dashed var(--argile); }
.sac b { display: block; font: 900 22px/1 var(--pochoir); margin: 8px 0 4px; }
.sac span { display: block; font: 700 10px/1.3 var(--pochoir); letter-spacing: .1em; text-transform: uppercase; color: var(--argile); }
.sac .cl { font: 400 12px/1.3 var(--etiquette); text-transform: none; letter-spacing: 0; color: var(--encre); margin-top: 3px; }
.obs { padding: 8px 0; border-bottom: 1px solid rgba(42, 43, 51, .18); font: italic 400 16px/1.3 var(--carnet); }
.obs small { display: block; font: 700 11px/1.4 var(--pochoir); font-style: normal; letter-spacing: .12em; color: var(--encre-pale); }
.obs.vieille { color: var(--argile); }
.garde { min-height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; }
.garde .bas { padding-bottom: 12px; }
.garde .lune-ligne { display: flex; align-items: center; gap: 10px; margin-top: 10px; font: italic 400 18px/1.3 var(--carnet); }
.toucher { display: block; width: 100%; padding: 18px 0 8px; text-align: left; font: 700 13px/1.3 var(--pochoir); letter-spacing: .18em; text-transform: uppercase; }
.toucher::before { content: "→ "; }
.confirm p { font: italic 400 17px/1.35 var(--carnet); }
.courbe { width: 100%; height: 56px; display: block; border: 1px solid var(--argile); background: var(--papier); }
.retour-marais { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); z-index: 7; width: min(90vw, 440px); }
.hiver-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 10px); background: var(--papier); border-top: 2px solid var(--encre); }
.hiver-bar .compteur { font: 700 13px/1.3 var(--pochoir); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
.hiver-bar p { margin: 0 0 8px; font-size: 13px; line-height: 1.3; }
.hiver-bar .rang { display: flex; gap: 8px; align-items: stretch; }
.hiver-bar .rang .menu-types { flex: 1; margin: 0; }
.hiver-bar .rang .btn { width: auto; flex: 0 0 auto; margin: 0; padding: 8px 12px; font-size: 12px; }
.hiver-bar .rouge { color: var(--encre); font-weight: 600; }
.menu-types { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.menu-types button { flex: 1; min-width: 56px; min-height: 44px; border: 2px solid var(--encre); background: var(--papier); font: 700 11px/1.1 var(--pochoir); letter-spacing: .08em; text-transform: uppercase; }
.menu-types button.actif { background: var(--encre); color: var(--papier); }

/* ─── étiquettes des éléments dessinés (DOM, pas de texte dans le canvas) ─── */
.lbl { position: fixed; z-index: 1; pointer-events: none; font: 600 12px/1 var(--etiquette); letter-spacing: .1em; text-transform: uppercase; color: var(--encre); white-space: nowrap; }
.lbl.pale { color: var(--encre-pale); }
</style>
<div id="probe" aria-hidden="true"></div>
<canvas id="marais" aria-label="Plan du marais salant. Touche une parcelle pour sa fiche, un mur pour sa trappe, glisse sur un œillet blanc pour tirer le sel."></canvas>
<header id="ciel" aria-live="off">
  <div class="col">
    <div id="heure" class="big">—</div>
    <div id="maree-txt" class="lig">—</div>
    <div id="meteo" class="lig pale">—</div>
  </div>
  <div class="col mid"></div>
  <div class="col d">
    <div id="cash" class="big">0<small>€</small></div>
    <div id="mulon" class="lig">—</div>
    <div id="reserve" class="lig pale">—</div>
  </div>
</header>
<span id="lbl-seuil" class="lbl">Seuil</span><span id="lbl-mer" class="lbl">Mer</span><span id="lbl-etier" class="lbl">Étier</span><span id="lbl-baro" class="lbl pale">Baromètre</span>
<div id="bandeau" hidden></div>
<p id="marge"><em id="marge-txt"></em></p>
<nav id="barre" aria-label="Actions">
  <button id="b-carnet" type="button">Carnet</button>
  <button id="b-coop" type="button">Coopérative</button>
  <button id="b-creuser" type="button">Creuser</button>
</nav>
<div id="voile" hidden></div>
<div id="feuille" role="dialog" aria-modal="true" hidden><div class="poignee" aria-hidden="true"></div><div id="feuille-contenu" class="inner"></div></div>
<section id="page" hidden><div id="page-contenu" class="inner"></div></section>
<div id="hiver-bar" class="hiver-bar" hidden></div>

<script>
/* ── sim.js ── */
/* ŒILLETS — simulation pure : marée, météo, hydrologie du marais, économie.
   Aucune dépendance au DOM : le même fichier tourne dans Node (tests, réglage) et dans le jeu. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SIM = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);

  // ─────────────────────────── constantes (réglées par simulation) ───────────────────────────
  const P = {
    E0: 2.6, NIGHT: 0.3, RAIN_EVAP: 0.2, SAT: 260, SEA_S: 35, SILL: 0.72,
    K_SEA: 300000, K_GATE: 3000, L_PER_CM: 700, MAX_DROP: 10, YIELD_DIV: 14,
    FLEUR_RATE: 0.25, FLEUR_CAP: 1.5, ALGAE_GROW: 0.06, ALGAE_DIE: 0.25, ALGAE_EVAP: 0.25,
    CRACK_AFTER: { vasiere: 48, cobier: 24, fare: 12, aderne: 8, oeillet: 6 },
    CRACK_RATE: 0.006, LEAK_RATE: 0.4, REPAIR_BELOW: 0.8, LOST_BELOW: 0.5,
    PRICE_GROS: 0.8, PRICE_FLEUR: 12,
    COST: { oeillet: 60, aderne: 110, fare: 150, cobier: 180, vasiere: 300, clapet: 25, barometre: 80, lousse: 120, rhabillage: 60 },
    GROWTH: 0.1, VAS_GROWTH: 1.5, VAS_MAX: 4, COLS: 7, ROWS0: 5, ROWS_MAX: 11,
    EVAP_DAY_CM: 3.5, // évaporation moyenne (cm/jour) servant à exprimer la réserve en jours
  };
  const TYPES = {
    vasiere: { floor: 0, max: 40, area: 8 },
    cobier: { floor: -5, max: 20, area: 4 },
    fare: { floor: -10, max: 10, area: 3 },
    aderne: { floor: -15, max: 5, area: 2 },
    oeillet: { floor: -20, max: 2, area: 1 },
  };
  const DIG_TYPES = ['cobier', 'fare', 'aderne', 'oeillet'];
  const CLIMATES = {
    ordinaire: { dT: 0, rainP: 1005, dWind: 0, crack: 1, fleurT: 22 },
    secheresse: { dT: 3, rainP: 1001, dWind: 0.1, crack: 1, fleurT: 22 },
    pourri: { dT: -2, rainP: 1008, dWind: 0, crack: 1, fleurT: 22 },
    canicule: { dT: 5, rainP: 1005, dWind: 0, crack: 2, fleurT: 19 },
    vent: { dT: 0, rainP: 1005, dWind: 0.25, crack: 1, fleurT: 22 },
  };
  const CLIMATE_ORDER = ['secheresse', 'pourri', 'canicule', 'vent', 'ordinaire'];

  // ─────────────────────────── temps, lune, marée, météo partagée ───────────────────────────
  const EPOCH_MS = Date.UTC(2000, 0, 6, 18, 14);
  const SYNODIC_H = 29.530588 * 24, TIDE_H = 12.4206, H_MS = 3.6e6;
  const tH = (ms) => (ms - EPOCH_MS) / H_MS;
  const moonPhase = (ms) => ((tH(ms) / SYNODIC_H) % 1 + 1) % 1;
  const tideAmp = (ms) => 1.05 + 0.25 * Math.cos(2 * Math.PI * tH(ms) / (SYNODIC_H / 2));
  const tide = (ms) => tideAmp(ms) * Math.sin(2 * Math.PI * tH(ms) / TIDE_H);
  const isNight = (hour) => hour < 6.5 || hour >= 21.5;
  function localHour(ms) { const d = new Date(ms); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
  // prochaines pleines mers (ms) après `ms`
  function nextHighTides(ms, n) {
    const t = tH(ms), out = [];
    let k = Math.ceil((t - 0.25 * TIDE_H) / TIDE_H);
    while (out.length < n) { out.push(EPOCH_MS + (k + 0.25) * TIDE_H * H_MS); k++; }
    return out;
  }
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  // Les phases de pression sont fixes : la même averse le même mardi pour tout le monde.
  const PH = (() => { let s = 2026 * 9301 + 49297; const o = []; for (let i = 0; i < 4; i++) { s = (s * 9301 + 49297) % 233280; o.push(2 * Math.PI * s / 233280); } return o; })();
  const pressureRaw = (t) => 1013 + 6 * Math.sin(2 * Math.PI * t / 55.2 + PH[0]) + 5 * Math.sin(2 * Math.PI * t / 98.4 + PH[1])
    + 4 * Math.sin(2 * Math.PI * t / 190 + PH[2]) + 3 * Math.sin(2 * Math.PI * t / 329 + PH[3]);
  function pressureAt(st, ms) {
    let p = pressureRaw(tH(ms));
    if (st && st.tutorialEndMs && (ms - st.tutorialEndMs) / H_MS < 72) p = Math.max(p, 1012); // beau fixe garanti trois jours
    return p;
  }
  // L'averse scriptée : le surlendemain de la première journée, de 14 h à 16 h (date locale), la leçon de la pluie à heure fixe.
  function scriptedShower(st, ms) {
    if (!st.tutorialEndMs) return false;
    const d = new Date(st.tutorialEndMs); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 2);
    const start = d.getTime() + 14 * H_MS;
    return ms >= start && ms < start + 2 * H_MS;
  }
  function envAt(st, ms) {
    const hour = localHour(ms);
    const day = clamp((ms - st.seasonStartMs) / 864e5, 0, 30);
    const scripted = scriptedShower(st, ms);
    const Pn = scripted ? 1002 : pressureAt(st, ms), dP = scripted ? -0.3 : pressureAt(st, ms + H_MS) - Pn;
    const cl = CLIMATES[st.climate] || CLIMATES.ordinaire;
    const rain = scripted ? 1.8 : (Pn < cl.rainP && dP < 0) ? Math.min(4, (cl.rainP - Pn) * 0.6) : 0;
    const wind = clamp(0.1 + 0.9 * Math.abs(dP) + Math.max(0, 1010 - Pn) / 20 + cl.dWind, 0, 1);
    const Tmid = 20 + 7 * Math.sin(Math.PI * day / 36) + cl.dT;
    const T = Tmid + 6 * Math.cos(2 * Math.PI * (hour - 16) / 24) - (Pn < 1008 ? 4 : 0) - (rain > 0 ? 2 : 0);
    return { ms, hour, day, T, wind, rain, P: Pn, dP, night: isNight(hour), h: tide(ms), A: tideAmp(ms), moon: moonPhase(ms), fleurT: cl.fleurT, crack: cl.crack };
  }
  // Première journée : horloge virtuelle 06:00 -> 06:00, ciel scripté.
  function tutorialEnv(vh, holdTide) {
    const hour = vh % 24, rain = (vh >= 23 && vh < 24.5) ? 3 : 0;
    let h = 1.2 * Math.sin(2 * Math.PI * (vh - 7 + TIDE_H / 4) / TIDE_H);
    if (holdTide && vh > 6.7 && vh < 12) h = Math.max(h, 0.95); // la première marée attend que l'étier soit ouvert une fois
    return { ms: 0, hour, day: 0, T: 22 + 7 * Math.cos(2 * Math.PI * (hour - 16) / 24) - (rain ? 5 : 0), wind: 0.5, rain,
      P: rain ? 1003 : 1018, dP: rain ? -0.3 : 0.05, night: isNight(hour), h, A: 1.2, moon: 0.05, fleurT: 22, crack: 1 };
  }
  const evapMmH = (env, algae) => P.E0 * clamp((env.T - 10) / 15, 0, 1.25) * (1 + 0.6 * env.wind) * (1 + P.ALGAE_EVAP * algae)
    * (env.night ? P.NIGHT : 1) * (env.rain > 0 ? P.RAIN_EVAP : 1);
  const fleurOK = (env) => env.T > env.fleurT && env.wind < 0.4 && env.rain === 0 && env.hour >= 15 && env.hour < 20;

  // ─────────────────────────── grille, parcelles, trappes ───────────────────────────
  const canFeed = (pt, ct) => { const d = TYPES[pt].floor - TYPES[ct].floor; return (d > 0 && d <= P.MAX_DROP) || (d === 0 && ct === 'oeillet'); };
  const posKey = (r, c) => r === 0 ? '0,0' : r + ',' + c;
  const gateKey = (a, b) => { const ka = posKey(a.r, a.c), kb = posKey(b.r, b.c); return ka < kb ? ka + '|' + kb : kb + '|' + ka; };
  const cap = (c) => TYPES[c.type].area * P.L_PER_CM;
  const salinity = (c) => c.depth > 0 ? c.salt / (c.depth * cap(c)) : 0;
  const kgOf = (g) => g / 1000 / P.YIELD_DIV;
  const maxDepth = (st, c) => c.type === 'vasiere' ? TYPES.vasiere.max * Math.pow(P.VAS_GROWTH, st.vasEnl) : (c.type === 'oeillet' && st.enEau ? 8 : TYPES[c.type].max);
  const bucket = (S) => S <= 0 ? 'sec' : S < 80 ? 'canard' : S < 150 ? 'violet30' : S < 220 ? 'violet60' : S < P.SAT - 2 ? 'rose' : 'blanc';

  // Cache (hors sauvegarde) de la grille et des trappes, invalidé dès que les parcelles changent.
  const CACHE = new WeakMap();
  function cacheOf(st) {
    let k = CACHE.get(st);
    if (!k || k.cells !== st.cells || k.n !== st.cells.length) { k = { cells: st.cells, n: st.cells.length, grid: null, gates: null }; CACHE.set(st, k); }
    return k;
  }
  const touch = (st) => CACHE.delete(st);
  function cellAt(st, r, c) {
    const k = cacheOf(st);
    if (!k.grid) { k.grid = new Map(); for (const x of st.cells) k.grid.set(x.type === 'vasiere' ? '0,0' : x.r + ',' + x.c, x); }
    return k.grid.get(r === 0 ? '0,0' : r + ',' + c) || null;
  }
  function neighborsOf(st, cell) {
    const out = [];
    if (cell.type === 'vasiere') { for (let c = 0; c < P.COLS; c++) { const n = cellAt(st, 1, c); if (n) out.push(n); } return out; }
    const cand = [[cell.r - 1, cell.c], [cell.r + 1, cell.c], [cell.r, cell.c - 1], [cell.r, cell.c + 1]];
    for (const [r, c] of cand) {
      if (r < 0 || r >= st.rows || c < 0 || c >= P.COLS) continue;
      const n = cellAt(st, r, c); if (n) out.push(n);
    }
    return out;
  }
  function neighborPositions(st, r, c) {
    const out = [];
    for (const [rr, cc] of [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]) {
      if (rr < 0 || rr >= st.rows || cc < 0 || cc >= P.COLS) continue;
      out.push([rr, cc]);
    }
    return out;
  }
  // Toutes les trappes existantes : [{key, a, b, from, to}] ; from/to = sens de l'eau (null si œillet-œillet : par la pente)
  function gatesOf(st) {
    const k = cacheOf(st);
    if (k.gates) return k.gates;
    const out = [], seen = new Set();
    for (const a of st.cells) for (const b of neighborsOf(st, a)) {
      const key = gateKey(a, b);
      if (seen.has(key)) continue;
      seen.add(key);
      if (a.type === 'oeillet' && b.type === 'oeillet') out.push({ key, a, b, from: null, to: null }); // par la pente d'eau
      else if (canFeed(a.type, b.type)) out.push({ key, a, b, from: a, to: b });
      else if (canFeed(b.type, a.type)) out.push({ key, a, b, from: b, to: a });
    }
    k.gates = out;
    return out;
  }
  const gateOpen = (st, key) => st.gates[key] === 1;
  function cellGates(st, cell) { return gatesOf(st).filter((g) => g.a === cell || g.b === cell); }
  // Un œillet est « nourri » s'il a une trappe possible vers une aderne ou un fare
  const hasBasinFeeder = (st, cell) => neighborsOf(st, cell).some((n) => n.type !== 'oeillet' && canFeed(n.type, 'oeillet'));

  // ─────────────────────────── un pas de simulation ───────────────────────────
  function step(st, env, dt) {
    const cells = st.cells, vas = cells.find((c) => c.type === 'vasiere');
    const S = st.stats;
    // 1. la mer et l'étier
    if (vas && (st.etierOpen || st.enEau || st.items.clapet)) {
      const kSea = P.K_SEA * Math.pow(1.25, st.vasEnl), C = cap(vas);
      if (env.h > P.SILL) {
        let V = kSea * (env.h - P.SILL) * dt;
        V = Math.min(V, Math.max(0, (maxDepth(st, vas) - vas.depth) * C));
        if (V > 0) {
          const V0 = vas.depth * C;
          vas.algae = V0 + V > 0 ? vas.algae * V0 / (V0 + V) : 0;
          vas.depth += V / C; vas.salt += V * P.SEA_S; S.intake += V / P.L_PER_CM;
        }
      } else if (!st.items.clapet && !st.enEau && st.etierOpen && env.h < P.SILL - 0.05 && vas.depth > 0) {
        const V = Math.min(kSea * (P.SILL - env.h) * dt * 0.5, vas.depth * C);
        const f = V / (vas.depth * C);
        vas.salt *= 1 - f; vas.depth -= V / C;
      }
    }
    // 2. écoulements par les trappes ouvertes
    for (const g of gatesOf(st)) {
      if (!gateOpen(st, g.key)) continue;
      let u = g.from, v = g.to;
      if (!u) { // œillet -> œillet : par la pente d'eau
        if (g.a.depth > g.b.depth) { u = g.a; v = g.b; } else { u = g.b; v = g.a; }
      }
      const head = (TYPES[u.type].floor + u.depth) - (TYPES[v.type].floor + v.depth);
      if (head <= 0 || u.depth <= 0) continue;
      const Cu = cap(u), Cv = cap(v);
      let V = Math.min(P.K_GATE * head * dt, 0.5 * head * Cu * Cv / (Cu + Cv));
      V = Math.min(V, u.depth * Cu, Math.max(0, (maxDepth(st, v) - v.depth) * Cv));
      if (V <= 0) continue;
      const fu = V / (u.depth * Cu), moved = u.salt * fu, Vv = v.depth * Cv;
      v.algae = (v.algae * Vv + u.algae * V) / (Vv + V);
      u.salt -= moved; u.depth -= V / Cu; v.salt += moved; v.depth += V / Cv;
    }
    // 3. évaporation, fuites, pluie, précipitation, algues, argile, fleur
    let nOe = 0;
    for (const c of cells) {
      const C = cap(c), md = maxDepth(st, c);
      c.depth = Math.max(0, c.depth - evapMmH(env, c.algae) / 10 * dt);
      if (c.integ < 0.8 && c.depth > 0) c.depth = Math.max(0, c.depth - P.LEAK_RATE * (1 - c.integ) * dt);
      if (env.rain > 0) {
        c.depth += env.rain / 10 * dt;
        if (c.depth > md) { c.salt *= md / c.depth; c.depth = md; }
        if (c.fleur > 0) { c.crust += c.fleur * 1000 * P.YIELD_DIV; c.fleur = 0; }
      }
      const V = c.depth * C;
      if (V <= 0.5) { c.crust += c.salt; c.salt = 0; c.depth = 0; }
      else {
        const s = c.salt / V;
        if (s > P.SAT) { const ex = c.salt - P.SAT * V; c.crust += ex; c.salt -= ex; if (c.type === 'oeillet') { S.gFormed += ex; c.gDay += ex; } else S.gLostUpstream += ex; }
        else if (c.crust > 0) {
          const d = Math.min(c.crust, (P.SAT - s) * V);
          c.crust -= d; c.salt += d;
          if (c.type === 'oeillet') { S.gRedissolved += d; if (env.rain > 0) S.gRainRedissolved += d; }
        }
      }
      const s2 = salinity(c);
      if (c.depth > 0 && s2 >= 150 && s2 <= 280 && env.T > 18 && !env.night) c.algae = Math.min(1, c.algae + P.ALGAE_GROW * dt);
      else if (c.depth <= 0 || s2 < 100 || s2 > 290) c.algae = Math.max(0, c.algae - P.ALGAE_DIE * dt);
      if (c.depth <= 0.02) {
        c.dryH += dt;
        if (c.dryH > P.CRACK_AFTER[c.type] && !st.enEau) c.integ = Math.max(0, c.integ - P.CRACK_RATE * env.crack * dt);
      } else c.dryH = 0;
      if (c.type === 'oeillet') {
        nOe++;
        if (c.depth > 0 && s2 >= 250 && fleurOK(env)) c.fleur = Math.min(P.FLEUR_CAP, c.fleur + P.FLEUR_RATE * dt);
        if (c.algae >= 0.5 && s2 >= 150) c.pinkH += dt;
      } else if (c.type === 'aderne') { if (c.algae >= 0.5 && s2 >= 150) c.pinkH += dt; }
    }
    S.oeilletDays += nOe * dt / 24;
    S.simH += dt;
  }

  // ─────────────────────────── réserve, projections ───────────────────────────
  function reserveDays(st) { // jours d'évaporation couverts par l'eau présente
    let stock = 0, area = 0;
    for (const c of st.cells) { stock += c.depth * TYPES[c.type].area; area += TYPES[c.type].area; }
    return area ? stock / (P.EVAP_DAY_CM * area) : 0;
  }
  function storageDays(st, vasEnl) { // capacité : jours d'évaporation que le marais plein peut tenir
    let stock = 0, area = 0;
    for (const c of st.cells) { const md = c.type === 'vasiere' ? TYPES.vasiere.max * Math.pow(P.VAS_GROWTH, vasEnl == null ? st.vasEnl : vasEnl) : TYPES[c.type].max; stock += md * TYPES[c.type].area; area += TYPES[c.type].area; }
    return area ? stock / (P.EVAP_DAY_CM * area) : 0;
  }
  function upstreamArea(st) { return st.cells.filter((c) => c.type !== 'oeillet').reduce((a, c) => a + TYPES[c.type].area, 0); }
  const countType = (st, type) => st.cells.filter((c) => c.type === type).length;
  // Régime permanent : EUR/jour que le marais peut rendre (pour le carnet)
  function yieldEurDay(Aup, N) { const unit = P.EVAP_DAY_CM * P.L_PER_CM * P.PRICE_GROS / (P.YIELD_DIV * 1000); return unit * Math.min((Aup + N) * P.SEA_S, N * (P.SAT - 2)); }
  function projection(st, env, c) {
    // {kind:'sature'|'sec'|'tenu'|'rien', hours}
    const gates = cellGates(st, c).filter((g) => gateOpen(st, g.key));
    const fed = gates.some((g) => { const f = gateFlow(st, g); return f.v === c && f.cmH > 0; });
    if (c.depth <= 0) return { kind: 'rien' };
    const E = evapMmH(env, c.algae) / 10; // cm/h
    if (E <= 0) return { kind: 'rien' };
    const s = salinity(c);
    if (fed && c.type === 'oeillet') return { kind: 'tenu' };
    if (s >= P.SAT) return { kind: 'sec', hours: c.depth / E };
    const x = c.depth * (1 - s / P.SAT);
    return { kind: 'sature', hours: x / E, thenDry: (c.depth - x) / E };
  }
  function gateFlow(st, g) { // cm/h reçus par la parcelle aval, pour la fiche
    let u = g.from, v = g.to;
    if (!u) { if (g.a.depth > g.b.depth) { u = g.a; v = g.b; } else { u = g.b; v = g.a; } }
    const head = (TYPES[u.type].floor + u.depth) - (TYPES[v.type].floor + v.depth);
    if (head <= 0 || u.depth <= 0) return { u, v, cmH: 0 };
    const Cu = cap(u), Cv = cap(v);
    const LH = Math.min(P.K_GATE * head, 0.5 * head * Cu * Cv / (Cu + Cv) * 6);
    return { u, v, cmH: LH / Cv };
  }

  // ─────────────────────────── état, nouvelle partie ───────────────────────────
  function newCell(type, r, c, init) {
    return Object.assign({ id: 0, r, c, type, depth: 0, salt: 0, algae: 0, crust: 0, fleur: 0, integ: 1, dryH: 0, gDay: 0, pinkH: 0, num: 0 }, init || {});
  }
  function withS(cell, S) { cell.salt = S * cell.depth * cap(cell); return cell; }
  function numberCells(st) {
    const n = {};
    for (const c of st.cells) { if (c.type === 'vasiere') continue; n[c.type] = (n[c.type] || 0) + 1; if (!c.num) c.num = n[c.type]; else n[c.type] = Math.max(n[c.type], c.num); }
  }
  function addCell(st, cell) {
    cell.id = ++st.nextId;
    if (cell.type !== 'vasiere') { let mx = 0; for (const o of st.cells) if (o.type === cell.type) mx = Math.max(mx, o.num); cell.num = mx + 1; }
    st.cells.push(cell); touch(st);
    return cell;
  }
  function newState(nowMs) {
    const st = {
      v: 1, installMs: nowMs, seasonStartMs: nowMs, seasonIndex: 1, climate: 'ordinaire', rows: P.ROWS0, nextId: 0,
      lastSimMs: nowMs, tutorialDone: false, tutorialEndMs: 0, tutorialVh: 6, tutoFlags: {}, winterBank: 0, phase: 'garde',
      cash: 0, mulon: 0, mulonStripes: [], fleurStock: 0, items: { clapet: false, barometre: false, lousse: false },
      vasEnl: 0, enEau: false, etierOpen: false, cells: [], gates: {},
      stats: freshStats(), carnet: [], records: [], seenObs: {}, lastObsDay: -1, lastReturnMs: nowMs,
      clock: { anchorReal: nowMs, anchorSim: nowMs, speed: 1 },
    };
    addCell(st, newCell('vasiere', 0, 0));
    addCell(st, newCell('cobier', 1, 3));
    addCell(st, withS(newCell('fare', 2, 3, { depth: 10, algae: 0.2 }), 130));
    addCell(st, withS(newCell('aderne', 3, 3, { depth: 5, algae: 0.9 }), 190));
    addCell(st, newCell('oeillet', 4, 3, { integ: 0.92 }));
    for (const g of gatesOf(st)) st.gates[g.key] = 0;
    return st;
  }
  function freshStats() { return { kgRaked: 0, kgFleur: 0, eurSold: 0, gRedissolved: 0, gRainRedissolved: 0, gFormed: 0, gLostUpstream: 0, repairs: 0, spent: 0, intake: 0, oeilletDays: 0, simH: 0, fleurEvenings: 0 }; }

  // ─────────────────────────── actions ───────────────────────────
  function plotCost(st, type) { return type === 'vasiere' ? P.COST.vasiere * Math.pow(P.VAS_GROWTH, st.vasEnl) : P.COST[type] * (1 + P.GROWTH * countType(st, type)); }
  // Peut-on creuser `type` en (r,c) ? -> {ok, reason, cost}
  function canDig(st, r, c, type) {
    const cost = plotCost(st, type);
    if (r <= 0 || r >= st.rows || c < 0 || c >= P.COLS || cellAt(st, r, c)) return { ok: false, reason: 'occupe', cost };
    const ns = neighborPositions(st, r, c).map(([rr, cc]) => cellAt(st, rr, cc)).filter(Boolean);
    if (!ns.length) return { ok: false, reason: 'amont', cost };
    const feeders = ns.filter((n) => canFeed(n.type, type));
    if (!feeders.length) {
      const anyHigher = ns.some((n) => TYPES[n.type].floor > TYPES[type].floor);
      return { ok: false, reason: anyHigher ? 'denivele' : 'amont', cost };
    }
    if (type === 'oeillet' && feeders.every((n) => n.type === 'oeillet') && !feeders.some((n) => hasBasinFeeder(st, n))) return { ok: false, reason: 'chapelet', cost };
    if (st.cash < cost) return { ok: false, reason: 'argent', cost, missing: cost - st.cash };
    return { ok: true, cost };
  }
  function dig(st, r, c, type) {
    const chk = canDig(st, r, c, type);
    if (!chk.ok) return chk;
    st.cash -= chk.cost; st.stats.spent += chk.cost;
    const cell = addCell(st, newCell(type, r, c));
    for (const g of gatesOf(st)) if (!(g.key in st.gates)) st.gates[g.key] = st.enEau ? 1 : 0;
    return { ok: true, cell };
  }
  function enlargeVasiere(st) {
    if (st.vasEnl >= P.VAS_MAX) return { ok: false, reason: 'max' };
    const cost = plotCost(st, 'vasiere');
    if (st.cash < cost) return { ok: false, reason: 'argent', cost, missing: cost - st.cash };
    st.cash -= cost; st.stats.spent += cost; st.vasEnl++;
    return { ok: true };
  }
  function buyItem(st, id) {
    if (st.items[id]) return { ok: false, reason: 'possede' };
    const cost = P.COST[id];
    if (st.cash < cost) return { ok: false, reason: 'argent', cost, missing: cost - st.cash };
    st.cash -= cost; st.stats.spent += cost; st.items[id] = true;
    if (id === 'clapet') st.etierOpen = true;
    return { ok: true };
  }
  function repair(st, cell) {
    if (st.cash < P.COST.rhabillage) return { ok: false, reason: 'argent', cost: P.COST.rhabillage, missing: P.COST.rhabillage - st.cash };
    st.cash -= P.COST.rhabillage; st.stats.spent += P.COST.rhabillage; st.stats.repairs++; cell.integ = 1; cell.dryH = 0;
    return { ok: true };
  }
  function rakeCell(st, cell, weatherCode) {
    if (cell.type !== 'oeillet' || cell.crust <= 0) return 0;
    const kg = kgOf(cell.crust); cell.crust = 0;
    st.mulon += kg; st.stats.kgRaked += kg;
    const last = st.mulonStripes[st.mulonStripes.length - 1];
    if (last && last.w === weatherCode) last.kg += kg; else st.mulonStripes.push({ kg, w: weatherCode });
    if (st.mulonStripes.length > 60) st.mulonStripes.shift();
    return kg;
  }
  function skimCell(st, cell) {
    if (!st.items.lousse || cell.type !== 'oeillet' || cell.fleur <= 0) return 0;
    const kg = cell.fleur; cell.fleur = 0; st.fleurStock += kg; st.stats.kgFleur += kg;
    return kg;
  }
  function sell(st) {
    const eur = st.mulon * P.PRICE_GROS + st.fleurStock * P.PRICE_FLEUR;
    const r = { kg: st.mulon, fleur: st.fleurStock, eur };
    st.cash += eur; st.stats.eurSold += eur; st.mulon = 0; st.fleurStock = 0; st.mulonStripes = [];
    return r;
  }
  function toggleGate(st, key) { st.gates[key] = st.gates[key] === 1 ? 0 : 1; return st.gates[key]; }
  function toggleEtier(st) { if (st.items.clapet) return null; st.etierOpen = !st.etierOpen; return st.etierOpen; }
  function miseEnEau(st) { st.enEau = true; for (const k in st.gates) st.gates[k] = 1; st.etierOpen = true; }
  function leverEau(st) {
    st.enEau = false;
    for (const c of st.cells) {
      if (c.type !== 'oeillet' || c.depth <= 2) continue;
      const feeders = neighborsOf(st, c).filter((n) => n.type !== 'oeillet' && canFeed(n.type, 'oeillet')).sort((a, b) => (maxDepth(st, b) - b.depth) - (maxDepth(st, a) - a.depth));
      let V = (c.depth - 2) * cap(c);
      for (const p of feeders) { // l'excédent retourne aux adernes et fares voisins, tant qu'il y a de la place ; le reste reste dans l'œillet
        if (V <= 0) break;
        const room = Math.max(0, (maxDepth(st, p) - p.depth) * cap(p)), Vm = Math.min(V, room);
        if (Vm <= 0) continue;
        const f = Vm / (c.depth * cap(c));
        p.depth += Vm / cap(p); p.salt += c.salt * f; c.salt -= c.salt * f; c.depth -= Vm / cap(c); V -= Vm;
      }
    }
  }

  // ─────────────────────────── rattrapage (absence) ───────────────────────────
  // Rejoue la simulation de st.lastSimMs à nowMs par pas de 10 min. Rend un rapport.
  function catchUp(st, nowMs, onEvent) {
    const DT_MS = 600000, DT = 1 / 6;
    const rep = { fromMs: st.lastSimMs, toMs: nowMs, tides: 0, rains: [], glyphs: [], kgFormed: 0, fleur: 0, enEau: st.enEau, hivernage: false,
      adernePink: null, oeilletDry: null, steps: 0 };
    const start = Math.max(st.lastSimMs, nowMs - 60 * 864e5);
    const g0 = st.stats.gFormed, f0 = st.cells.filter((c) => c.type === 'oeillet').reduce((a, c) => a + c.fleur, 0);
    const pinkStart = st.cells.filter((c) => c.type === 'aderne' && c.algae >= 0.5).map((c) => c.id);
    let t = start, lastH = tide(start), inRain = false, chunkStart = start, chunk = { rain: 0, night: 0, cloud: 0, n: 0 };
    const seasonEnd = seasonEndMs(st);
    while (t < nowMs) {
      const t2 = Math.min(t + DT_MS, nowMs);
      if (t2 > seasonEnd && st.phase === 'play') { rep.hivernage = true; rep.toMs = seasonEnd; st.pendingHivernage = true; break; }
      const env = envAt(st, t);
      step(st, env, (t2 - t) / H_MS);
      rep.steps++;
      if (lastH <= P.SILL && env.h > P.SILL) rep.tides++;
      lastH = env.h;
      if (env.rain > 0) { if (!inRain) { inRain = true; rep.rains.push({ ms: t, g0: st.stats.gRainRedissolved }); } }
      else if (inRain) { inRain = false; const r = rep.rains[rep.rains.length - 1]; r.kg = kgOf(st.stats.gRainRedissolved - r.g0); }
      chunk.n++; if (env.rain > 0) chunk.rain++; if (env.night) chunk.night++; if (env.P < 1008) chunk.cloud++;
      if (t2 - chunkStart >= TIDE_H * H_MS || t2 >= nowMs) {
        rep.glyphs.push(chunk.rain > chunk.n * 0.15 ? 'pluie' : chunk.night > chunk.n * 0.6 ? 'lune' : chunk.cloud > chunk.n * 0.5 ? 'nuage' : 'soleil');
        chunkStart = t2; chunk = { rain: 0, night: 0, cloud: 0, n: 0 };
      }
      if (onEvent) onEvent(t2, env);
      t = t2;
    }

/* ŒILLETS — feuilles basses et pages (DOM) : fiche de parcelle, creuser, carnet, coopérative, retour, hivernage, garde, confirmations. */
const SHEETS = (() => {
  'use strict';
  const S = SIM, t = COPY.t, pl = COPY.pl, $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const feuille = $('#feuille'), fc = $('#feuille-contenu'), page = $('#page'), pc = $('#page-contenu'), voile = $('#voile');
  let onCloseSheet = null, openedAt = 0;

  function openSheet(html, onClose) {

  }
  function closeSheet() { if (feuille.hidden) return; feuille.hidden = true; voile.hidden = true; fc.innerHTML = ''; const f = onCloseSheet; onCloseSheet = null; if (f) f(); }
  function openPage(html) { pc.innerHTML = html; page.hidden = false; page.scrollTop = 0; }
  function closePage() { page.hidden = true; pc.innerHTML = ''; }
  const isOpen = () => !feuille.hidden || !page.hidden;
  voile.addEventListener('pointerdown', (e) => { if (performance.now() - openedAt > 350) { e.preventDefault(); closeSheet(); } });
  const on = (root, sel, fn) => root.querySelectorAll(sel).forEach((el) => el.addEventListener('click', (e) => { UI.buzz(6); fn(el, e); }));
  const bouton = (id, txt, cls) => `<button type="button" class="btn ${cls || ''}" data-a="${id}">${txt}</button>`;
  const typeName = (type) => t('type_' + type);

  // ─── fiche de parcelle ───
  function fiche(cell) {
    const st = UI.st, env = UI.env, Sg = S.salinity(cell), kg = S.kgOf(cell.crust);
    const nom = cell.type === 'vasiere' ? t('type_vasiere').toUpperCase() : `${typeName(cell.type).toUpperCase()} ${cell.num}`;
    const alg = COPY.T.algues_etats[cell.algae < 0.15 ? 0 : cell.algae < 0.45 ? 1 : cell.algae < 0.8 ? 2 : 3];
    let lignes = '';
    if (cell.type === 'vasiere') lignes += ligne(t('fiche_vasiere', { cm: UI.fmt(cell.depth, 0), max: UI.fmt(S.maxDepth(st, cell), 0), etat: st.items.clapet ? t('clapet_court') : st.etierOpen ? t('etier_ouvert') : t('etier_ferme') }), st.items.clapet ? t('fiche_clapet') : '');
    else lignes += ligne(t('fiche_niveau', { cm: UI.fmt(cell.depth, 1) }), `${UI.fmt(S.maxDepth(st, cell), 0)}\u202fcm max${st.enEau ? ' · en eau' : ''}`);
    lignes += ligne(t('fiche_salinite', { gl: UI.fmt(Sg, 0) }), Sg >= S.P.SAT - 2 ? 'saturée' : Sg >= 220 ? 'presque' : Sg >= 150 ? 'rose' : Sg >= 80 ? 'en chemin' : 'eau jeune');
    lignes += ligne(t('fiche_temperature', { c: UI.fmt(env.T, 0) }), t('fiche_surface', { n: S.TYPES[cell.type].area, s: pl(S.TYPES[cell.type].area) }));
    lignes += ligne(t('fiche_argile', { pct: UI.fmt(cell.integ * 100, 0) }), cell.integ < 0.8 ? `<span style="color:var(--rouge)">${t('fiche_fissure')}</span>` : '');
    lignes += ligne(t('fiche_algues', { etat: alg }), cell.algae >= 0.5 ? '+25 % d’évaporation' : '');
    if (cell.type === 'oeillet') { lignes += ligne(t('fiche_sel', { kg: UI.fmt(kg, 1) }), kg > 0 ? 'glisse pour tirer' : ''); if (cell.fleur > 0.05) lignes += ligne(t('fiche_fleur', { kg: UI.fmt(cell.fleur, 2) }), st.items.lousse ? 'touche l’œillet pour écumer' : t('lousse_absente')); else if (S.salinity(cell) >= 250 && !(env.hour >= 15 && env.hour < 20)) lignes += ligne('Fleur', t('fiche_fleur_fenetre')); }
    else if (kg > 1) lignes += ligne(t('fiche_croute', { kg: UI.fmt(kg, 0) }), '');
    if (cell.depth <= 0.02 && cell.dryH > 0.5) lignes += ligne(t('fiche_a_sec', { h: UI.fmt(cell.dryH, 0) }), cell.dryH > S.P.CRACK_AFTER[cell.type] ? 'l’argile fissure' : `fissures après ${S.P.CRACK_AFTER[cell.type]} h`);
    const pr = S.projection(st, env, cell);

    else if (pr.kind === 'sec') proj = t('fiche_projection_sec', { h: UI.fmt(pr.hours, 0) });
    else if (pr.kind === 'tenu') proj = t('fiche_projection_stable');
    // trappes
    let trappes = '';
    for (const g of S.cellGates(st, cell)) {
      const other = g.a === cell ? g.b : g.a, open = S.gateOpen(st, g.key), fl = S.gateFlow(st, g);
      const dir = other.type === 'vasiere' ? 'N' : other.r < cell.r ? 'N' : other.r > cell.r ? 'S' : other.c < cell.c ? 'O' : 'E';
      const vers = other.type === 'vasiere' ? t('type_vasiere') : `${typeName(other.type)} ${other.num}`;
      const debit = open && fl.cmH > 0 ? `${UI.fmt(Math.min(fl.cmH, 99), 1)} cm/h vers ${fl.v === cell ? 'ici' : 'l’aval'}` : open ? 'rien ne coule' : '';

    if (cell.type !== 'vasiere' && cell.integ < S.P.REPAIR_BELOW) actions.push(bouton('repair', t('btn_rhabiller'), st.cash >= S.P.COST.rhabillage ? 'jaune' : ''));

    openSheet(`<p class="sur">${esc(typeName(cell.type))}${cell.type === 'oeillet' ? ' · ' + t('creuser_conseil_oeillet') : ''}</p><h2>${esc(nom)}</h2>
      ${proj ? `<p class="ital">${esc(proj)}</p>` : ''}
      <div>${lignes}</div>
      ${trappes ? `<h3>Trappes</h3><ul class="liste">${trappes}</ul>` : ''}
      <div class="rang" style="margin-top:12px">${actions.join('')}</div>${bouton('close', t('btn_fermer'), 'plein')}`, () => { UI.select(null); });
    UI.select(cell);
    on(fc, '[data-a]', (el) => {
      const a = el.dataset.a;
      if (a === 'close') closeSheet();
      else if (a.startsWith('gate:')) { S.toggleGate(st, a.slice(5)); UI.changed(); fiche(cell); }
      else if (a === 'repair') { const r = S.repair(st, cell); if (!r.ok) UI.flash(t('creuser_impossible_argent', { eur: UI.fmt(r.missing, 0) })); UI.changed(); fiche(cell); }
      else if (a === 'etier') { S.toggleEtier(st); UI.changed(); fiche(cell); }
      else if (a === 'eneau') confirm(t('mise_en_eau_confirm'), () => { S.miseEnEau(st); UI.changed(); });
      else if (a === 'lever') confirm(t('lever_eau_confirm'), () => { S.leverEau(st); UI.changed(); });
    });
  }
  const ligne = (a, b) => `<div class="ligne"><span>${a}</span><span class="pale" style="text-align:right">${b}</span></div>`;

  // ─── creuser ───
  function creuser(r, c) {
    const st = UI.st;
    let choix = '', sel = null;
    for (const type of S.DIG_TYPES) {
      const chk = S.canDig(st, r, c, type), prix = UI.fmt(chk.cost, 0);

      choix += `<button type="button" data-type="${type}" class="${chk.ok ? '' : 'non'}"><span class="nom">${esc(typeName(type))}</span><span class="etiquette">${prix} €</span>${raison}</button>`;
    }
    openSheet(`<p class="sur">${t('btn_creuser')}</p><h2>${t('creuser_titre', { r, c: c + 1 })}</h2><p class="pale">${t('creuser_aide')}</p>

  // ─── confirmation ───

    const pink = ads.filter((c) => c.pinkH >= 48).sort((a, b) => b.pinkH - a.pinkH)[0];
    if (pink) cands.push(['obs_rose', { n: pink.num, j: fmt(pink.pinkH / 24, 0) }]);
    if (st.stats.kgFleur >= 5) cands.push(['obs_fleur', { kg: fmt(st.stats.kgFleur, 1), eur: fmt(st.stats.kgFleur * 12, 0), kg_gros: fmt(st.stats.kgFleur * 15, 0) }]);
    if (oes.length) cands.push(['obs_ratio', { aup: S.upstreamArea(st), n: oes.length, s: pl(oes.length) }]);
    const choice = cands.find(([k]) => !(k in st.seenObs) || day - st.seenObs[k] >= 5);
    if (choice) { st.seenObs[choice[0]] = day; st.carnet.push({ season: st.seasonIndex, day, text: t(choice[0], choice[1]) }); if (st.carnet.length > 120) st.carnet.shift(); }
    for (const c of oes) c.gDay = 0;
    st.daySnap = { gLost: st.stats.gLostUpstream, gRain: st.stats.gRainRedissolved };
  }

  // ─── boucle ───
  function frame(now) {
    const rdt = Math.min(0.6, Math.max(0, (now - lastFrame) / 1000)); lastFrame = now;
    if (st.phase === 'tuto') {
      const target = Math.min(30, tutoVh + rdt * 0.04); // ×144 : 24 h simulées en 10 min réelles
      let guard = 0;
      while (tutoSimVh < target - 1e-9 && guard++ < 400) { // rattrape aussi un saut d'horloge (test, image en retard)
        const d = Math.min(1 / 6, target - tutoSimVh); tutoSimVh += d;
        tutoEnv = S.tutorialEnv(tutoSimVh, !st.tutoFlags.etierOnce && !st.etierOpen); S.step(st, tutoEnv, d);
      }
      tutoVh = target; st.tutorialVh = tutoVh;
      tutoEnv = S.tutorialEnv(tutoVh, !st.tutoFlags.etierOnce && !st.etierOpen); env = tutoEnv; env.ms = Date.now();
      dirty = true;
      if (tutoVh >= 30) endTutorial();
    } else if (st.phase === 'play') {
      const simMs = simNow(), gapMs = simMs - st.lastSimMs;
      if (gapMs > 10 * 60000) {
        const rep = S.catchUp(st, simMs);
        env = S.envAt(st, simNow());
        save();
        if (!SHEETS.isOpen() && (rep.hivernage || gapMs / st.clock.speed >= 45 * 60000)) SHEETS.retour(rep);
        dirty = true;
      } else if (gapMs > 0) {
        env = S.envAt(st, simMs);
        S.step(st, env, gapMs / 3.6e6);
        st.lastSimMs = simMs;
      } else env = S.envAt(st, simMs);
      const day = S.seasonDay(st, simMs);
      if (day !== st.lastObsDay && st.tutorialDone) observe(day);
      if ((st.pendingHivernage || simMs >= S.seasonEndMs(st)) && !SHEETS.isOpen()) startHivernage(true);
    } else {
      env = S.envAt(st, simNow());
    }
    if (flood > 0 && flood < 0.8) { flood = Math.min(0.8, flood + rdt * 0.3); dirty = true; if (flood >= 0.8) SHEETS.hivernagePage(); }
    for (const s of strokes) s.life -= rdt * 1.6;
    if (strokes.length) { strokes = strokes.filter((s) => s.life > 0); dirty = true; }
    if (bannerUntil !== Infinity && bannerUntil && now > bannerUntil) { $('#bandeau').hidden = true; bannerUntil = 0; }
    if (flashUntil && now > flashUntil) { flashUntil = 0; dirty = true; }
    if (R.layout(st).gridBottom !== lastGridBottom) placeDom();
    if (dirty || now - lastDraw > (reduceMotion ? 1000 : 480)) {
      lastDraw = now; dirty = false;
      $('#lbl-baro').textContent = baroWord();
      suggest();
      R.draw(st, env, { mode, selected, selFree, ring, strokes, flood, baro: baroData(), reduceMotion, problems: mode === 'hiver' ? S.winterProblems(st) : null });
      hud();
    }
    if (now - lastSave > 30000 && st.phase !== 'garde') save();
    requestAnimationFrame(frame);
  }

  // ─── hivernage ───
  function startHivernage(auto) {
    if (st.phase !== 'play') return;
    SHEETS.closeSheet(); SHEETS.closePage();
    S.hivernage(st, simNow(), auto);
    st.winterBank = 0; mode = 'play'; setRing(null);
    flood = 0.01; dirty = true; save();
  }
  function setMode(m) {
    mode = m; selected = null; selFree = null; dirty = true;
    $('#b-creuser').classList.toggle('actif', m === 'creuser');
    $('#barre').hidden = m === 'hiver'; $('#marge').hidden = false;
    if (m === 'hiver') { SHEETS.hiverBar(); R.setBottomInset($('#hiver-bar').offsetHeight + 4); }
    else { $('#hiver-bar').hidden = true; R.setBottomInset(0); }
    placeDom();
  }
  function openSeasonUI() {
    S.openSeason(st, Date.now()); resetClock(); flood = 0; setMode('play'); changed();
    flash(t('marge_fin_journee', { heure: fmtHeure(S.nextHighTides(simNow(), 1)[0]) }), 8000);
  }

  // ─── entrées tactiles ───
  function input() {
    const cv = $('#marais');
    let down = null, dragged = false, raked = new Set();
    cv.addEventListener('pointerdown', (e) => {
      if (SHEETS.isOpen() || st.phase === 'garde' || down || e.isPrimary === false) return;
      down = { x: e.clientX, y: e.clientY, id: e.pointerId, hit: R.hit(st, e.clientX, e.clientY), lx: e.clientX, ly: e.clientY };
      dragged = false; raked = new Set();
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture indisponible */ }
      e.preventDefault();
    });
    cv.addEventListener('pointermove', (e) => {
      if (!down || e.pointerId !== down.id) return;
      if (!dragged && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 18) dragged = true;
      if (dragged && mode !== 'hiver') {
        const h = R.hit(st, e.clientX, e.clientY);
        if (h && h.kind === 'cell' && h.cell.type === 'oeillet' && !raked.has(h.cell.id) && h.cell.crust > 0) {
          raked.add(h.cell.id);
          const kg = S.rakeCell(st, h.cell, env.rain > 0 ? 'p' : env.night ? 'n' : 's');
          strokes.push({ x0: down.lx, y0: down.ly, x1: e.clientX, y1: e.clientY, life: 1 });
          buzz(10); flash(`+${fmt(kg, 1)} kg au mulon`); changed();
        }
        down.lx = e.clientX; down.ly = e.clientY;
      }
      e.preventDefault();
    });
    const up = (e) => {
      if (!down || e.pointerId !== down.id) return;
      const h = down.hit; down = null;
      if (dragged || !h) return;
      tap(h);
    };
    cv.addEventListener('pointerup', up);
    const cancel = (e) => { if (down && e.pointerId === down.id) down = null; };
    cv.addEventListener('pointercancel', cancel); cv.addEventListener('lostpointercapture', cancel);
    $('#marge-txt').addEventListener('click', margeTap);
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    $('#b-carnet').addEventListener('click', () => { buzz(6); if (mode === 'creuser') setMode('play'); SHEETS.carnet(false); });
    $('#b-coop').addEventListener('click', () => { buzz(6); if (mode === 'creuser') setMode('play'); SHEETS.coop(); });
    $('#b-creuser').addEventListener('click', () => { buzz(6); setMode(mode === 'creuser' ? 'play' : 'creuser'); if (mode === 'creuser') flash(t('creuser_aide')); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { SHEETS.closeSheet(); SHEETS.closePage(); } });
  }
  function tap(h) {
    if (mode === 'hiver') {
      if (h.kind === 'free') { if (winterType === 'vase') return; if (!S.winterSet(st, h.r, h.c, winterType)) flash('Plus de parcelle à placer : rends-en une à la vase d’abord.'); }
      else if (h.kind === 'cell' && h.cell.type !== 'vasiere') S.winterSet(st, h.cell.r, h.cell.c, winterType === 'vase' ? null : winterType);
      else return;
      buzz(8); changed(); SHEETS.hiverBar(); return;
    }
    if (h.kind === 'etier') { if (st.items.clapet) { flash(t('marge_clapet')); return; } S.toggleEtier(st); buzz(8); changed(); return; }
    if (h.kind === 'gate') { S.toggleGate(st, h.gate.key); buzz(8); changed(); return; }
    if (h.kind === 'free') { if (mode === 'creuser') SHEETS.creuser(h.r, h.c); else { setMode('creuser'); SHEETS.creuser(h.r, h.c); } return; }
    if (h.kind === 'cell') {
      const c = h.cell;
      if (mode === 'creuser' && c.type === 'vasiere') { SHEETS.agrandir(); return; }
      if (c.type === 'oeillet' && c.fleur > 0.15 && st.items.lousse) { const kg = S.skimCell(st, c); buzz([8, 20, 8]); flash(`+${fmt(kg, 2)} kg de fleur`); changed(); return; }
      if (c.type === 'oeillet' && c.fleur > 0.15 && !st.items.lousse) flash(t('lousse_absente'));
      SHEETS.fiche(c);
    }
  }

  // ─── démarrage ───
  function boot() {
    R.init($('#marais'), $('#probe'));
    st = load();
    const fresh = !st;
    if (fresh) st = S.newState(Date.now());
    speed = st.clock.speed;
    const m = /^#x(\d+)$/.exec(location.hash);
    if (m) setSpeed(Math.max(1, Math.min(2000, +m[1])));
    env = st.phase === 'tuto' ? S.tutorialEnv(st.tutorialVh || 6) : S.envAt(st, simNow());
    tutoVh = st.tutorialVh || 6; tutoSimVh = tutoVh;
    placeDom();
    input();
    window.addEventListener('resize', () => { R.resize(); placeDom(); dirty = true; });
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { lastFrame = performance.now(); dirty = true; } });
    window.addEventListener('pagehide', save);
    if (st.phase === 'garde') SHEETS.garde(corrupt ? t('sauvegarde_perdue') : '');
    else if (st.phase === 'hiver') { SHEETS.hivernagePage(); flood = 0.8; }
    lastFrame = performance.now();
    requestAnimationFrame(frame);
    window.__oeillets = { get st() { return st; }, get env() { return env; }, SIM: S, R, simNow, setSpeed, save, catchUp: (ms) => S.catchUp(st, ms), setVh: (v) => { tutoVh = v; }, startHivernage, setMode, redraw: () => { dirty = true; }, reset: () => { try { localStorage.removeItem(KEY); } catch (e) { /* rien */ } location.reload(); } };
  }
  document.addEventListener('DOMContentLoaded', boot);
  if (document.readyState !== 'loading') setTimeout(boot, 0);

  return {
    get st() { return st; }, get env() { return env; }, get speed() { return speed; }, get winterType() { return winterType; }, set winterType(v) { winterType = v; },
    fmt, fmtHeure, fmtJour, fmtJourCourt, lune, simNow, save, changed, buzz, flash, forecast, resetClock, setMode, openSeasonUI, startTutorial, startHivernage, nomParcelle,
    select(c) { selected = c; dirty = true; }, selectFree(p) { selFree = p; dirty = true; },
    onSold(r) { if (r.eur > 0) flash(`Vendu : ${fmt(r.eur, 2)} €`); },
  };
})();

</script>
