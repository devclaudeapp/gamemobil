<title>Le Fournil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap">
<style>
/* LE FOURNIL — lumineux et doux : crème, fraise, beurre, menthe ; formes rondes, gros chiffres, boutons à épaisseur.
   Structure : en-tête, scène (qui se replie), pages à onglets, barre d'onglets. */
:root {
  --creme: #FFF7EC; --carte: #FFFFFF; --texte: #4A3328; --texte-2: #8C6F62; --ligne: #F0E4D8;
  --fraise: #FF6B8B; --fraise-sombre: #E1496C; --beurre: #FFC84A; --beurre-sombre: #E0A61E; --menthe: #5FD3A4; --menthe-sombre: #3FB889;
  --lavande: #B8A6FF; --lavande-sombre: #9A84F0; --peche: #FFE0C7; --gris: #EADFD6; --gris-texte: #B5A49A; --gris-sombre: #D9CCC2;
  --ombre: rgba(74, 51, 40, .10);
  --titre: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
  --texte-font: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --scene-h: 200px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--creme); color: var(--texte); overflow: hidden; }
body { font: 700 15px/1.35 var(--texte-font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--lavande); outline-offset: 2px; }
#probe { position: fixed; left: -9999px; top: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
svg { display: block; }
.ico { display: inline-grid; place-items: center; flex: 0 0 auto; }
.ico svg { width: 24px; height: 24px; }

/* ─── en-tête : solde, cloche, étoiles ─── */
#haut { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px 6px; }
.solde { display: flex; align-items: center; gap: 10px; min-width: 0; }
.solde .piece { width: 40px; height: 40px; flex: 0 0 auto; }
.solde b { display: block; font: 700 clamp(24px, 7.2vw, 32px)/1 var(--titre); letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.solde small { display: block; margin-top: 2px; font-size: 13px; color: var(--texte-2); white-space: nowrap; }
.solde small b { display: inline; font: 800 13px/1 var(--texte-font); color: var(--menthe-sombre); }
#taux { display: block; }
.marche { display: inline-block; margin: 2px 4px 0 0; padding: 2px 7px; border-radius: 999px; background: var(--beurre); color: var(--texte); font: 800 11px/1.3 var(--texte-font); white-space: nowrap; }
.haut-btns { display: flex; gap: 8px; flex: 0 0 auto; align-items: center; }
.pastille { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 999px; background: var(--carte);
  box-shadow: 0 3px 0 var(--gris-sombre); font: 700 17px/1 var(--titre); color: var(--texte); }
.pastille:active { transform: translateY(3px); box-shadow: none; }
.pastille svg { width: 22px; height: 22px; }
.pastille.cloche { padding: 0 10px; }
.pastille.cloche .point { position: absolute; top: 6px; right: 8px; width: 11px; height: 11px; border-radius: 50%; background: var(--fraise); box-shadow: 0 0 0 2.5px #fff; }
.pastille.cloche.actif { background: #FFE9EE; box-shadow: 0 3px 0 #F3B6C4; animation: cloche 1.6s ease-in-out infinite; }
@keyframes cloche { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-12deg); } 85% { transform: rotate(10deg); } 95% { transform: rotate(-5deg); } }
.pastille.etoile { background: var(--beurre); box-shadow: 0 3px 0 var(--beurre-sombre); }
.pastille.etoile.pret { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ─── scène : pleine hauteur dans la Boutique, repliée ailleurs ou quand on fait défiler ─── */
#scene-wrap { position: relative; flex: 0 0 auto; height: var(--scene-h); overflow: hidden; transition: height .25s cubic-bezier(.2, .8, .2, 1); }
body.replie #scene-wrap { height: 112px; }
#scene { position: absolute; left: 0; bottom: 0; width: 100%; display: block; touch-action: none; }
#enseigne { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 2; display: inline-flex; align-items: center; gap: 6px; max-width: 70%; min-height: 34px; padding: 0 14px; border-radius: 999px;
  background: #fff; box-shadow: 0 3px 0 var(--gris-sombre); font: 700 15px/1 var(--titre); color: var(--texte); white-space: nowrap; transition: opacity .2s, transform .2s; }
#enseigne span { overflow: hidden; text-overflow: ellipsis; }
#enseigne:active { transform: translateX(-50%) translateY(3px); box-shadow: none; }
body.replie #enseigne { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-10px); }

/* ─── pages ─── */
#pages { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 20px); }
.page { padding-bottom: 8px; }
.page-tete { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 2px 10px; }
.page-tete h2 { margin: 0; display: flex; align-items: center; gap: 10px; font: 700 24px/1.1 var(--titre); }
.page-tete h2 .pic { width: 40px; height: 40px; border-radius: 13px; background: var(--peche); display: grid; place-items: center; }
.page-tete h2 .pic svg { width: 24px; height: 24px; }
.serie { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; min-height: 36px; border-radius: 999px; background: var(--carte); box-shadow: 0 3px 0 var(--gris-sombre); font: 700 14px/1 var(--titre); white-space: nowrap; }
.serie svg { width: 20px; height: 20px; }
.serie.lav { background: var(--lavande); color: #fff; box-shadow: 0 3px 0 var(--lavande-sombre); }
.serie.or { background: var(--beurre); box-shadow: 0 3px 0 var(--beurre-sombre); }
.bloc { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.card { padding: 12px 14px; border-radius: 22px; background: var(--carte); box-shadow: 0 6px 16px var(--ombre); }
.card.pret { box-shadow: 0 0 0 3px var(--menthe), 0 6px 16px var(--ombre); }
.c-tete { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.c-tete .pic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto; background: var(--creme); }
.c-tete .pic.peche { background: var(--peche); } .c-tete .pic.lav { background: #EFEAFF; } .c-tete .pic.rose { background: #FFE9EE; }
.c-tete .pic svg { width: 22px; height: 22px; }
.c-tete h3 { margin: 0; font: 700 18px/1.1 var(--titre); flex: 1 1 auto; min-width: 0; }
.c-tete .compte { font: 800 13px/1 var(--texte-font); color: var(--texte-2); padding: 5px 9px; border-radius: 999px; background: var(--creme); white-space: nowrap; }
.c-tete .compte.ok { background: var(--menthe); color: #fff; }
.c-tete .compte.or { background: var(--beurre); color: var(--texte); }
.ligne { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--ligne); }
.ligne:last-of-type { border-bottom: 0; }
.ligne .t { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 15px; }
.ligne .t > span:first-child { min-width: 0; }
.ligne .t > span b { display: block; font: 700 15px/1.2 var(--titre); }
.ligne .t > span small { display: block; font-size: 12px; line-height: 1.3; color: var(--texte-2); }
.ligne .p { display: block; margin-top: 2px; font: 800 13px/1 var(--texte-font); color: var(--texte-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ligne .t { flex-direction: column; align-items: flex-start; gap: 0; }
.ligne.habitue .t, .ev-liste .ligne .t { flex-direction: row; align-items: center; gap: 10px; }
.ligne .btn { min-width: 108px; min-height: 44px; border-radius: 14px; }
.ligne .btn b { font-size: 15px; }
.ligne .ok { font: 700 14px/1 var(--titre); color: var(--menthe-sombre); padding: 0 8px; white-space: nowrap; }
.ligne.fait .t, .ligne.fait .p { color: var(--menthe-sombre); }
.ligne .mini { grid-column: 1 / -1; margin-top: 0; }
.ligne.habitue { grid-template-columns: 18px minmax(0, 1fr); }
.ev-liste .ligne { grid-template-columns: minmax(0, 1fr) auto; }
.ev-liste .ev-ico { width: 34px; height: 34px; border-radius: 11px; background: var(--creme); display: grid; place-items: center; flex: 0 0 auto; }
.ev-liste .ev-ico svg { width: 26px; height: 26px; }
.ev-liste .ligne.en-cours .ev-ico { background: #FFE9EE; }
.chrono-pill { font: 700 15px/1 var(--titre); padding: 7px 10px; border-radius: 999px; background: #FFE9EE; color: var(--fraise-sombre); font-variant-numeric: tabular-nums; }
.note { margin: 8px 0 0; font: 700 12px/1.35 var(--texte-font); color: var(--texte-2); }
.note.centre { text-align: center; margin-top: 4px; }
.card.pain { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-items: center; }
.card.pain .icone { width: 48px; height: 48px; border-radius: 14px; background: var(--peche); display: grid; place-items: center; }
.card.pain .icone svg { width: 38px; height: 38px; }
.card.pain b { display: block; font: 700 16px/1.1 var(--titre); }
.card.pain span { display: block; font-size: 13px; color: var(--texte-2); margin-top: 3px; }
.card.boulanger-tete { display: flex; gap: 12px; align-items: center; }
.card.boulanger-tete > svg { width: 76px; height: 76px; flex: 0 0 auto; background: var(--peche); border-radius: 24px; padding: 6px; }
.card.boulanger-tete > div { min-width: 0; flex: 1 1 auto; }
.card.boulanger-tete h3 { margin: 0 0 2px; font: 700 22px/1.1 var(--titre); }
.card.boulanger-tete .sous { margin: 0 0 6px; font-size: 13px; }
.card.reglages { padding: 4px 6px; }
.reglage { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; min-height: 60px; padding: 8px 8px; text-align: left; border-bottom: 1px solid var(--ligne); border-radius: 14px; }
.reglage:last-child { border-bottom: 0; }
.reglage:active { background: var(--creme); }
.reglage > .ico { width: 40px; height: 40px; border-radius: 13px; background: var(--creme); }
.reglage > span { min-width: 0; }
.reglage > span b { display: block; font: 700 16px/1.15 var(--titre); }
.reglage > span small { display: block; margin-top: 2px; font-size: 12px; line-height: 1.3; color: var(--texte-2); }
.reglage .chev { width: 24px; height: 24px; background: none; opacity: .5; }

/* ─── barre d'onglets ─── */
#onglets { flex: 0 0 auto; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px 6px calc(env(safe-area-inset-bottom, 0px) + 6px); background: var(--carte);
  border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(74, 51, 40, .10); }
#onglets button { position: relative; display: grid; justify-items: center; gap: 2px; min-height: 56px; padding: 2px 0 0; color: var(--texte-2); font: 700 12px/1 var(--titre); }
#onglets button .ico { width: 48px; height: 32px; border-radius: 12px; transition: background .15s; }
#onglets button.actif { color: var(--texte); }
#onglets button.actif .ico { background: var(--peche); }
#onglets button:active .ico { transform: scale(.94); }
.badge { position: absolute; top: -4px; right: calc(50% - 26px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--fraise); color: #fff; font: 800 12px/20px var(--texte-font); text-align: center; box-shadow: 0 0 0 2.5px #fff; font-style: normal; }
.badge.lavande { background: var(--lavande-sombre); }
.badge.beurre { background: var(--beurre); color: var(--texte); }
.badge.point { min-width: 12px; width: 12px; height: 12px; padding: 0; }

/* ─── boutique : barre d'achat, ticket des objectifs, cartes ─── */
.barre-achat { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 8px 2px 8px; background: var(--creme); }
.barre-achat .modes { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--carte); box-shadow: 0 3px 0 var(--gris-sombre); }
.barre-achat .modes button { min-width: 42px; min-height: 38px; padding: 0 8px; border-radius: 999px; font: 700 14px/1 var(--titre); color: var(--texte-2); }
.barre-achat .modes button.actif { background: var(--texte); color: #fff; }
.btn-am { position: relative; margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px 0 12px; border-radius: 999px; background: var(--lavande); color: #fff;
  box-shadow: 0 3px 0 var(--lavande-sombre); font: 700 15px/1 var(--titre); white-space: nowrap; }
.btn-am:active { transform: translateY(3px); box-shadow: none; }
.btn-am .ico svg { width: 22px; height: 22px; stroke: #fff; }
.btn-am .badge { top: -6px; right: -4px; box-shadow: 0 0 0 3px var(--creme); }
.btn-am.pret { animation: pulse 1.2s ease-in-out infinite; }
.ticket { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 52px; margin: 0 0 10px; padding: 6px 10px 6px 8px; border-radius: 18px; text-align: left;
  background: var(--carte); box-shadow: 0 4px 12px var(--ombre); }
.ticket:active { transform: translateY(2px); }
.ticket > .ico { width: 36px; height: 36px; border-radius: 12px; background: var(--peche); }
.ticket > .ico svg { width: 22px; height: 22px; }
.ticket .tk-txt { min-width: 0; display: grid; gap: 2px; }
.ticket .tk-txt b { font: 700 15px/1.1 var(--titre); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticket .tk-txt small { font: 700 12px/1.25 var(--texte-font); color: var(--texte-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ticket .tk-pill { display: inline-flex; align-items: center; justify-content: center; min-height: 30px; min-width: 30px; padding: 0 6px; border-radius: 999px; font: 800 13px/1 var(--texte-font); color: var(--texte-2); }
.ticket .tk-pill .ico svg { width: 20px; height: 20px; opacity: .5; }
.ticket.pret { box-shadow: 0 0 0 3px var(--menthe), 0 4px 12px var(--ombre); animation: pulse 1.2s ease-in-out infinite; }
.ticket.pret .tk-pill { background: var(--menthe); color: #fff; padding: 0 10px; }
.ticket.complet > .ico { background: #FFF3C4; }
#cartes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.carte, .card, .am { min-width: 0; }
.carte { display: grid; grid-template-columns: 54px minmax(0, 1fr) 106px; gap: 10px; align-items: center; padding: 10px 10px 10px 12px; border-radius: 20px; background: var(--carte);
  box-shadow: 0 6px 16px var(--ombre); position: relative; }
.carte .icone { position: relative; width: 54px; height: 54px; border-radius: 16px; background: var(--peche); display: grid; place-items: center; }
.carte .icone svg { width: 42px; height: 42px; }
.carte .icone .niv { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); min-width: 26px; padding: 3px 6px; border-radius: 999px; background: var(--texte); color: #fff; font: 800 11px/1 var(--texte-font); text-align: center; box-shadow: 0 0 0 2px #fff; }
.carte .corps { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; }
.carte h3 { margin: 0; font: 700 17px/1.1 var(--titre); letter-spacing: -.01em; display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; min-width: 0; }
.carte h3 .nom { min-width: 0; }
.carte .palier { position: relative; display: flex; justify-content: space-between; gap: 8px; padding-bottom: 7px; font: 800 11px/1 var(--texte-font); color: var(--texte-2); white-space: nowrap; }
.carte .palier span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.carte .palier span + span { color: var(--gris-texte); flex: 0 0 auto; }
@media (max-width: 370px) { .carte .palier span + span { display: none; } }
.carte .palier b { color: var(--texte); }
.carte .palier::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; border-radius: 2px; background: var(--creme); }
.carte .palier i { position: absolute; left: 0; bottom: 0; height: 4px; border-radius: 2px; background: var(--beurre); transition: width .3s; }
.carte .palier.bientot span + span { color: var(--beurre-sombre); }
.btn { position: relative; }
.btn .pal-badge { position: absolute; top: -8px; right: -4px; padding: 3px 6px; border-radius: 999px; background: var(--beurre); color: var(--texte); font: 800 10px/1 var(--texte-font); font-style: normal; white-space: nowrap; box-shadow: 0 0 0 2px #fff; }
.carte .barre { position: relative; height: 26px; border-radius: 999px; background: var(--creme); overflow: hidden; }
.carte .barre i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: var(--menthe); }
.carte .barre i.rapide { background: linear-gradient(90deg, var(--menthe), var(--menthe-sombre)); width: 100% !important; }
.carte .barre span { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font: 800 13px/1 var(--texte-font); white-space: nowrap; }
.carte .barre .rev { left: 10px; color: var(--texte); }
.carte .barre .tps { right: 10px; color: var(--texte-2); font-weight: 700; }
.carte .barre .cuire { right: 10px; color: var(--fraise-sombre); font: 700 13px/1 var(--titre); letter-spacing: .02em; }
.carte.manuel:not(.actif) .barre { outline: 2px dashed var(--fraise); outline-offset: -2px; }
.carte.manuel:not(.actif):active .barre { background: #FFE9EE; }
.boutons { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; width: 106px; min-width: 0; }
.btn { display: grid; justify-items: center; gap: 2px; min-height: 44px; padding: 5px 8px; border-radius: 14px; background: var(--fraise); color: #fff; box-shadow: 0 4px 0 var(--fraise-sombre); transition: transform .05s; }
.btn small { font: 700 11px/1 var(--texte-font); opacity: .92; letter-spacing: .02em; }
.btn b { font: 700 15px/1 var(--titre); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn.menthe { background: var(--menthe); box-shadow: 0 4px 0 var(--menthe-sombre); }
.btn.beurre { background: var(--beurre); color: var(--texte); box-shadow: 0 4px 0 var(--beurre-sombre); }
.btn.lavande { background: var(--lavande); box-shadow: 0 4px 0 var(--lavande-sombre); }
.btn.sombre { background: var(--texte); box-shadow: 0 4px 0 #2b1d16; }
.btn.non { background: var(--gris); color: var(--gris-texte); box-shadow: 0 4px 0 var(--gris-sombre); }
.btn.non:active { transform: none; box-shadow: 0 4px 0 var(--gris-sombre); }
.btn.large { width: 100%; min-height: 56px; border-radius: 20px; }
.btn.large b { font-size: 19px; }
.btn.promo { background: linear-gradient(135deg, #C8863A, #E8B46A); box-shadow: 0 4px 0 #A8621F; }
.staff-ok { display: flex; align-items: center; gap: 4px; min-height: 28px; min-width: 0; padding: 2px 6px 2px 3px; border-radius: 999px; background: var(--creme); font: 800 12px/1.1 var(--texte-font); color: var(--texte-2); white-space: nowrap; overflow: hidden; }
.staff-ok svg { width: 22px; height: 22px; flex: 0 0 auto; }
.staff-ok span { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
.staff-ok .coche svg { width: 14px; height: 14px; stroke: var(--menthe-sombre); stroke-width: 3; }
.carte.verrou { grid-template-columns: 54px minmax(0, 1fr); background: #FFFBF4; box-shadow: none; border: 2px dashed var(--gris-sombre); }
.carte.verrou .icone { background: var(--creme); }
.carte.verrou .icone svg { opacity: .45; filter: grayscale(1); }
.carte.verrou p { margin: 0; font-size: 13px; color: var(--texte-2); font-weight: 700; }
.carte.verrou .btn { margin-top: 4px; width: 100%; }
.carte.verrou.secret { opacity: .55; }
.carte.verrou.secret h3 { color: var(--texte-2); }
.carte.gouter { box-shadow: 0 0 0 3px var(--lavande), 0 6px 16px rgba(154, 132, 240, .3); }
.carte.gouter .icone { background: #EFEAFF; }
.badge-critique { position: absolute; top: -9px; left: 14px; z-index: 1; background: var(--lavande-sombre); color: #fff; font: 800 11px/1 var(--texte-font); padding: 5px 9px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }
.tag { display: inline-block; padding: 2px 6px; border-radius: 999px; background: var(--beurre); color: var(--texte); font: 800 10px/1.3 var(--texte-font); vertical-align: middle; white-space: nowrap; flex: 0 0 auto; }
.tag.spe { background: var(--lavande); color: #fff; }

    openSheet(`<h2>Pendant ton absence</h2><p class="sous">${G.fmtDuree(abs.secs)}${abs.secs >= G.heuresAbsence(st) * 3600 ? ` (les apprentis s’arrêtent après ${G.heuresAbsence(st)} h)` : ''}</p>
      <div class="grand-nombre">+${G.fmtEur(abs.total)}</div><p class="sous">vendus par tes apprentis</p><ul class="detail">${detail}</ul>
      <button type="button" class="btn large menthe" data-a="close"><b>Super !</b></button>`);
    on('[data-a="close"]', closeSheet);
  }

  // ─── boucle ───
  function frame(now) {
    const dt = Math.min(0.25, Math.max(0, (now - lastFrame) / 1000)); lastFrame = now;
    const out = G.tick(st, dt, Date.now());
    if (out.ventes.length) {
      const gros = out.ventes.reduce((a, v) => a + v.montant, 0), first = out.ventes[0];
      if (G.PRODUITS[first.i].temps >= 3 || Math.random() < 0.15) { SCENE.vente(first.i, gros, '+' + G.fmtEur(gros), !st.stations[first.i].staff); son.vente(gros); }
      if (!st.stations[first.i].staff && pageActive === 'boutique') { const r = cards[first.i].el.querySelector('.barre').getBoundingClientRect(); flottant(r.left + r.width / 2 - 30, r.top - 10, '+' + G.fmtEur(first.montant)); }
    }
    if (out.nouvelEv) { son.evenement(); buzz([15, 40, 15]); toast(TXT_EV[out.nouvelEv.type]); }
    if (out.finEv) { toast(FIN_EV[out.finEv.type]); if (out.finEv.type === 'critique' || out.finEv.type === 'petrissage') son.non(); }
    if (out.mystere && $('#feuille').hidden) { if (SCENE.mystere()) toast('Un client mystère ! Touche-le vite.'); }
    if (out.habitue) { SCENE.habitue(out.habitue); son.achat(); toast(`${out.habitue.nom} : « ${out.habitue.phrase} »`); }
    if (out.trophees && out.trophees.length) { const t0 = out.trophees[0]; son.deblocage(); buzz([10, 30, 10, 30, 10]); SCENE.fete(); toast(`Trophée : ${t0.nom} !${out.trophees.length > 1 ? ` (+${out.trophees.length - 1})` : ''}`); }
    const nv = G.niveau(st);
    if (nv > lastNiveau) { lastNiveau = nv; son.deblocage(); buzz([15, 40, 15, 40, 15]); SCENE.fete(); toast(`Niveau ${nv} : ${G.titre(st)} ! Un point de talent à apprendre.`); }
    renderCards(); hud(); renderObjectifs(); renderEvenement(); renderPage();
    SCENE.frame(dt, st, Date.now());
    indices();
    if (now - lastSave > 5000) save();
    requestAnimationFrame(frame);
  }
  function layout() {
    const h = Math.max(150, Math.min(240, Math.round(window.innerHeight * 0.27)));
    document.documentElement.style.setProperty('--scene-h', h + 'px');
    SCENE.resize(window.innerWidth, h);
  }

  // ─── démarrage ───
  async function boot() {
    st = await load();
    const fresh = !st;
    if (fresh) st = G.newState(Date.now());
    st.now = Date.now();
    if (!st.vu) st.vu = { trophees: trophesGagnes() };
    document.querySelectorAll('[data-ico]').forEach((el) => { el.innerHTML = ICONS.UI[el.dataset.ico] || ''; });
    SCENE.init($('#scene'));
    SCENE.surServi = (r) => { if (r.cadeau) { reussite(`${r.hb.nom}, fidèle depuis ${r.jours} jours, t’offre ${G.fmtEur(r.cadeau)} !`); } else if (r.jours > 1) toast(`${r.hb.nom} : ${r.jours}e jour de suite !`); };
    layout();
    buildCards();
    document.querySelectorAll('.modes button').forEach((b) => { b.classList.toggle('actif', String(st.mode) === b.dataset.mode); b.addEventListener('click', () => { st.mode = b.dataset.mode === 'max' ? 'max' : +b.dataset.mode; document.querySelectorAll('.modes button').forEach((x) => x.classList.toggle('actif', x === b)); renderCards(true); save(); }); });
    $('#cartes').addEventListener('click', onCardClick);
    $('#b-ameliorations').addEventListener('click', () => { audio(); sheetAmeliorations(); });
    $('#b-etoiles').addEventListener('click', () => { audio(); sheetEtoiles(); });
    $('#objectifs').addEventListener('click', () => { audio(); showPage('defis'); });
    $('#enseigne').addEventListener('click', () => { audio(); sheetNom(false); });
    $('#b-cloche').addEventListener('click', () => { audio(); if (st.ev) { if (pageActive !== 'boutique') showPage('boutique'); if (!evEtendu) basculerEvenement(); } else showPage('defis'); });
    $('#evenement').addEventListener('click', (e) => { if (e.target.closest('button')) return; audio(); basculerEvenement(); });
    document.querySelectorAll('#onglets button').forEach((b) => b.addEventListener('click', () => { audio(); if (b.dataset.page === pageActive) $('#pages').scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); else { son.tap(); showPage(b.dataset.page); } }));
    $('#pages').addEventListener('scroll', replier, { passive: true });
    $('#scene').addEventListener('pointerdown', (e) => {
      audio();
      const r = $('#scene').getBoundingClientRect();
      const sx = e.clientX - r.left, sy = e.clientY - r.top;
      if (SCENE.hit(sx, sy)) { const tip = G.encaisserPourboire(st); son.pourboire(); buzz([10, 20, 10, 20, 10]); SCENE.texte(`+${G.fmtEur(tip)} de pourboire !`); toast(`Le client mystère laisse ${G.fmtEur(tip)} de pourboire !`); renderCards(true); hud(); save(); }
      else if (SCENE.hitBoulanger(sx, sy)) showPage('boulanger');
      else { const id = SCENE.hitMeuble ? SCENE.hitMeuble(sx, sy) : null; if (id) sheetMeuble(id); else SCENE.tap(); }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { const abs = G.absence(st, Date.now()); if (abs.total > 0 && abs.secs > 90) { sheetRetour(abs); renderCards(true); } lastFrame = performance.now(); } });
    document.addEventListener('pointerdown', () => { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* rien */ } }, { once: true });
    window.addEventListener('pagehide', save);
    window.addEventListener('beforeunload', save);
    document.addEventListener('freeze', save);
    window.addEventListener('blur', save);
    window.addEventListener('resize', layout);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
    if (!fresh) { const abs = G.absence(st, Date.now()); if (abs.total > 0 && abs.secs > 90) sheetRetour(abs); }
    lastNiveau = G.niveau(st);
    renderCards(true); hud(); renderObjectifs(); renderEvenement();
    lastFrame = performance.now();
    requestAnimationFrame(frame);
    window.__fournil = { get st() { return st; }, G, SCENE, save, reset: () => { fige = true; return effacer().then(() => location.reload()); }, absence: (ms) => { st.lastSeen = Date.now() - ms; const abs = G.absence(st, Date.now()); sheetRetour(abs); renderCards(true); return abs; }, give: (n) => { G.gagner(st, n, true); renderCards(true); hud(); }, rush: () => G.lancerRush(st), commande: () => G.lancerCommande(st, Math.random), ev: (type) => G.lancerEvenement(st, Math.random, type), mystere: () => SCENE.mystere(), xp: (n) => G.gagnerXp(st, n), meuble: (id) => { const r = G.ameliorerMeuble(st, id); renderCards(true); hud(); save(); return r; }, fiche: sheetMeuble, page: showPage, boulanger: () => showPage('boulanger'), nommer: (n) => G.renommer(st, n), scene: (o) => SCENE.forcer(o), journal: () => showPage('journal'), habitue: (id) => SCENE.habitue(G.HABITUES.find((h) => h.id === id)), partager };
  }
  document.addEventListener('DOMContentLoaded', boot);
  if (document.readyState !== 'loading') setTimeout(boot, 0);
  return { get st() { return st; } };
})();

</script>
