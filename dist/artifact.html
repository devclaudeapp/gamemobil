<title>Le Fournil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap">
<style>
/* LE FOURNIL — lumineux et doux : crème, fraise, beurre, menthe ; formes rondes, gros chiffres, boutons à épaisseur. */
:root {
  --creme: #FFF7EC; --carte: #FFFFFF; --texte: #4A3328; --texte-2: #8C6F62; --ligne: #F0E4D8;
  --fraise: #FF6B8B; --fraise-sombre: #E1496C; --beurre: #FFC84A; --beurre-sombre: #E0A61E; --menthe: #5FD3A4; --menthe-sombre: #3FB889;
  --lavande: #B8A6FF; --lavande-sombre: #9A84F0; --peche: #FFE0C7; --gris: #EADFD6; --gris-texte: #B5A49A; --gris-sombre: #D9CCC2;
  --ombre: rgba(74, 51, 40, .10);
  --titre: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
  --texte-font: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--creme); color: var(--texte); overflow: hidden; }
body { font: 700 15px/1.35 var(--texte-font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--lavande); outline-offset: 2px; }
#probe { position: fixed; left: -9999px; top: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
svg { display: block; }

/* ─── en-tête ─── */
#haut { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px 6px; }
.solde { display: flex; align-items: center; gap: 10px; min-width: 0; }
.solde .piece { width: 40px; height: 40px; flex: 0 0 auto; }
.solde b { display: block; font: 700 clamp(26px, 7.6vw, 34px)/1 var(--titre); letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.solde small { display: block; margin-top: 2px; font-size: 13px; color: var(--texte-2); white-space: nowrap; }
.solde small b { display: inline; font: 800 13px/1 var(--texte-font); color: var(--menthe-sombre); }
.haut-btns { display: flex; gap: 8px; flex: 0 0 auto; }
.pastille { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 999px; background: var(--carte);
  box-shadow: 0 3px 0 var(--gris-sombre); font: 700 16px/1 var(--titre); color: var(--texte); }
.pastille:active { transform: translateY(3px); box-shadow: none; }
.pastille svg { width: 22px; height: 22px; }
.pastille.etoile { background: var(--beurre); box-shadow: 0 3px 0 var(--beurre-sombre); }
.pastille.etoile.pret { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ─── scène ─── */
#scene { flex: 0 0 auto; width: 100%; display: block; touch-action: none; }

/* ─── liste des produits ─── */
#liste { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 24px); }
.barre-achat { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 8px 2px 10px; background: var(--creme); }
.barre-achat .modes { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--carte); box-shadow: 0 3px 0 var(--gris-sombre); }
.barre-achat .modes button { min-width: 42px; min-height: 38px; padding: 0 8px; border-radius: 999px; font: 700 14px/1 var(--titre); color: var(--texte-2); }
.barre-achat .modes button.actif { background: var(--texte); color: #fff; }
.btn-am { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 999px; background: var(--lavande); color: #fff;
  box-shadow: 0 3px 0 var(--lavande-sombre); font: 700 14px/1 var(--titre); white-space: nowrap; }
.btn-am:active { transform: translateY(3px); box-shadow: none; }
.btn-am svg { width: 18px; height: 18px; }
.btn-am.pret { animation: pulse 1.2s ease-in-out infinite; }
#cartes { display: grid; gap: 10px; }
.carte { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px; border-radius: 22px; background: var(--carte);
  box-shadow: 0 6px 16px var(--ombre); position: relative; }
.carte .icone { width: 60px; height: 60px; border-radius: 18px; background: var(--peche); display: grid; place-items: center; }
.carte .icone svg { width: 46px; height: 46px; }
.carte .corps { min-width: 0; display: grid; gap: 6px; }
.carte h3 { margin: 0; font: 700 18px/1.1 var(--titre); letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.carte h3 .niv { font: 800 12px/1 var(--texte-font); color: var(--texte-2); padding: 3px 7px; border-radius: 999px; background: var(--creme); white-space: nowrap; }
.carte h3 .niv i { font-style: normal; color: var(--gris-texte); }
.carte .barre { position: relative; height: 30px; border-radius: 999px; background: var(--creme); overflow: hidden; }
.carte .barre i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: var(--menthe); }
.carte .barre i.rapide { background: linear-gradient(90deg, var(--menthe), var(--menthe-sombre)); width: 100% !important; }
.carte .barre span { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font: 800 13px/1 var(--texte-font); white-space: nowrap; }
.carte .barre .rev { left: 10px; color: var(--texte); }
.carte .barre .tps { right: 10px; color: var(--texte-2); font-weight: 700; }
.carte .barre .cuire { right: 10px; color: var(--fraise-sombre); font: 700 13px/1 var(--titre); letter-spacing: .02em; }
.carte.manuel:not(.actif) .barre { outline: 2px dashed var(--fraise); outline-offset: -2px; }
.carte.manuel:not(.actif):active .barre { background: #FFE9EE; }
.boutons { display: grid; gap: 6px; width: 118px; }
.btn { display: grid; justify-items: center; gap: 2px; min-height: 48px; padding: 6px 8px; border-radius: 16px; background: var(--fraise); color: #fff; box-shadow: 0 4px 0 var(--fraise-sombre); transition: transform .05s; }
.btn small { font: 700 11px/1 var(--texte-font); opacity: .9; letter-spacing: .02em; }
.btn b { font: 700 16px/1 var(--titre); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn.menthe { background: var(--menthe); box-shadow: 0 4px 0 var(--menthe-sombre); }
.btn.beurre { background: var(--beurre); color: var(--texte); box-shadow: 0 4px 0 var(--beurre-sombre); }
.btn.lavande { background: var(--lavande); box-shadow: 0 4px 0 var(--lavande-sombre); }
.btn.non { background: var(--gris); color: var(--gris-texte); box-shadow: 0 4px 0 var(--gris-sombre); }
.btn.non:active { transform: none; box-shadow: 0 4px 0 var(--gris-sombre); }
.btn.large { width: 100%; min-height: 56px; border-radius: 20px; }
.btn.large b { font-size: 19px; }
.staff-ok { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 8px; border-radius: 14px; background: var(--creme); font: 700 12px/1.15 var(--texte-font); color: var(--texte-2); }
.staff-ok svg { width: 28px; height: 28px; flex: 0 0 auto; }
.carte.verrou { grid-template-columns: 60px minmax(0, 1fr); background: #FFFBF4; box-shadow: none; border: 2px dashed var(--gris-sombre); }
.carte.verrou .icone { background: var(--creme); }
.carte.verrou .icone svg { opacity: .45; filter: grayscale(1); }
.carte.verrou p { margin: 0; font-size: 13px; color: var(--texte-2); font-weight: 700; }
.carte.verrou .btn { margin-top: 6px; width: 100%; }
.carte.verrou.secret { opacity: .55; }
.carte.verrou.secret h3 { color: var(--texte-2); }

/* ─── indice (tutoriel) ─── */
#indice { position: fixed; z-index: 6; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; width: min(78vw, 320px); }
#indice .bulle { padding: 10px 14px; border-radius: 18px; background: var(--texte); color: #fff; font: 700 15px/1.3 var(--texte-font); text-align: center; box-shadow: 0 6px 16px var(--ombre); text-wrap: balance; }
#indice .main { width: 36px; height: 36px; animation: tape .9s ease-in-out infinite; }
#indice.haut { flex-direction: column-reverse; }
#indice.haut .main { transform: rotate(180deg); animation-name: tapeHaut; }
@keyframes tape { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
@keyframes tapeHaut { 0%, 100% { transform: rotate(180deg) translateY(0); } 50% { transform: rotate(180deg) translateY(8px); } }

/* ─── feuilles ─── */
#voile { position: fixed; inset: 0; z-index: 7; background: rgba(74, 51, 40, .35); }
#feuille { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; max-height: 84%; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  background: var(--creme); border-radius: 28px 28px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); animation: monte .25s cubic-bezier(.2, .8, .2, 1); }
#feuille .poignee { width: 44px; height: 5px; margin: 0 auto 12px; border-radius: 3px; background: var(--gris-sombre); }
#feuille .inner { max-width: 520px; margin: 0 auto; }
@keyframes monte { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
h2 { margin: 0 0 4px; font: 700 26px/1.1 var(--titre); letter-spacing: -.01em; }
.sous { margin: 0 0 14px; color: var(--texte-2); font-weight: 700; }
.grand-nombre { font: 700 44px/1 var(--titre); color: var(--menthe-sombre); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.liste-am { display: grid; gap: 8px; }
.am { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 18px; background: var(--carte); box-shadow: 0 4px 12px var(--ombre); }
.am h3 { margin: 0; font: 700 16px/1.15 var(--titre); }
.am p { margin: 2px 0 0; font-size: 13px; color: var(--texte-2); }
.am .btn { min-width: 108px; }
.am.fait { opacity: .6; box-shadow: none; background: #FFFBF4; }
.am .ok { font: 700 14px/1 var(--titre); color: var(--menthe-sombre); padding: 0 8px; }
.stat { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--ligne); }
.stat:last-child { border-bottom: 0; }
.stat b { font: 700 16px/1 var(--titre); font-variant-numeric: tabular-nums; }
.detail { list-style: none; margin: 10px 0 14px; padding: 0; display: grid; gap: 4px; font-weight: 700; color: var(--texte-2); }
.detail li { display: flex; justify-content: space-between; gap: 8px; }
.detail li b { color: var(--texte); }
.ligne-reglage { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; }
.interrupteur { width: 56px; height: 32px; border-radius: 999px; background: var(--gris); position: relative; transition: background .15s; flex: 0 0 auto; }
.interrupteur::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px var(--ombre); transition: transform .15s; }
.interrupteur[aria-checked="true"] { background: var(--menthe); }
.interrupteur[aria-checked="true"]::after { transform: translateX(24px); }
.encadre { padding: 12px 14px; border-radius: 18px; background: var(--peche); margin: 10px 0 14px; font-weight: 700; }
.encadre.doux { background: #EFEAFF; }
.flottant { position: fixed; z-index: 5; pointer-events: none; font: 700 18px/1 var(--titre); color: var(--menthe-sombre); animation: monteFlotte .9s ease-out forwards; text-shadow: 0 2px 0 #fff; }
@keyframes monteFlotte { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%); z-index: 9; padding: 10px 16px; border-radius: 999px; background: var(--texte); color: #fff;
  font: 700 14px/1.2 var(--texte-font); box-shadow: 0 6px 16px var(--ombre); max-width: calc(100vw - 32px); text-align: center; border-radius: 22px; animation: monte .25s ease-out; }

/* ─── objectifs du jour ─── */
.obj { display: block; width: 100%; text-align: left; padding: 10px 12px 8px; border-radius: 20px; background: var(--carte); box-shadow: 0 6px 16px var(--ombre); margin-bottom: 10px; }
.obj:active { transform: translateY(2px); }
.obj.pret { outline: 3px solid var(--menthe); animation: pulse 1.2s ease-in-out infinite; }
.obj-tete { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.obj-titre { display: inline-flex; align-items: center; gap: 6px; font: 700 15px/1 var(--titre); }
.obj-titre svg { width: 18px; height: 18px; }
.obj-compte { font: 800 12px/1 var(--texte-font); color: var(--texte-2); padding: 4px 8px; border-radius: 999px; background: var(--creme); }
.obj.pret .obj-compte { background: var(--menthe); color: #fff; }
.obj.complet .obj-compte { background: var(--beurre); color: var(--texte); }
.obj-lignes { display: grid; gap: 4px; }
.obj-ligne { position: relative; display: flex; justify-content: space-between; gap: 8px; padding: 4px 0 6px; font-size: 13px; }
.obj-ligne span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.obj-ligne em { font-style: normal; color: var(--texte-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.obj-ligne i { position: absolute; left: 0; bottom: 0; height: 3px; border-radius: 2px; background: var(--menthe); }
.obj-ligne.fait span { color: var(--menthe-sombre); }
.obj-ligne.fait em { color: var(--menthe-sombre); }
.mini { height: 6px; margin-top: 6px; border-radius: 3px; background: var(--creme); overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--menthe); }
.marche { display: inline-block; margin: 2px 4px 0 0; padding: 2px 7px; border-radius: 999px; background: var(--beurre); color: var(--texte); font: 800 11px/1.3 var(--texte-font); white-space: nowrap; }
#taux { display: block; }
.lien { display: block; width: 100%; margin-top: 14px; text-align: center; font: 700 13px/1.2 var(--texte-font); color: var(--texte-2); text-decoration: underline; min-height: 40px; }

/* ─── événements ─── */
#evenement { margin-bottom: 10px; }
.ev { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px 14px; border-radius: 20px; overflow: hidden; color: #fff; }
.ev.rush { background: linear-gradient(135deg, #FF6B8B, #FF9A62); box-shadow: 0 6px 16px rgba(255, 107, 139, .35); }
.ev.commande { background: linear-gradient(135deg, #B8A6FF, #8FB8FF); box-shadow: 0 6px 16px rgba(184, 166, 255, .4); }
.ev.commande.prete { background: linear-gradient(135deg, #5FD3A4, #8FE3C2); }
.ev.critique { background: linear-gradient(135deg, #9A84F0, #C9A3F5); box-shadow: 0 6px 16px rgba(154, 132, 240, .4); }
.ev.meunier { background: linear-gradient(135deg, #C8863A, #E8B46A); box-shadow: 0 6px 16px rgba(200, 134, 58, .35); }
.ev.petrissage { background: linear-gradient(135deg, #E0A61E, #FFC84A); box-shadow: 0 6px 16px rgba(224, 166, 30, .35); }
.ev.panne { background: linear-gradient(135deg, #6E5A50, #9C8577); box-shadow: 0 6px 16px rgba(110, 90, 80, .35); }
.ev.anniversaire { background: linear-gradient(135deg, #FF6B8B, #B8A6FF); box-shadow: 0 6px 16px rgba(255, 107, 139, .35); }
.ev > svg { width: 44px; height: 44px; }
.ev.commande > svg, .ev.critique > svg, .ev.meunier > svg, .ev.petrissage > svg, .ev.panne > svg, .ev.anniversaire > svg { background: #fff; border-radius: 14px; padding: 4px; }
.ev .btn.tapote { background: #fff; color: var(--texte); box-shadow: 0 4px 0 rgba(0, 0, 0, .18); min-width: 92px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.ev .btn.tapote:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .18); }
.ev-compte { font-variant-numeric: tabular-nums; }
.btn.promo { background: linear-gradient(135deg, #C8863A, #E8B46A); box-shadow: 0 4px 0 #A8621F; }
.ev-txt { display: grid; gap: 2px; min-width: 0; }
.ev-txt b { font: 700 16px/1.1 var(--titre); }
.ev-txt span { font-size: 13px; line-height: 1.3; }
.ev-txt span b { font-size: 13px; font-family: var(--texte-font); font-weight: 800; }
.ev-chrono { font: 700 22px/1 var(--titre); font-variant-numeric: tabular-nums; }
.ev .btn { min-width: 96px; }
.ev-barre { position: absolute; left: 0; bottom: 0; height: 5px; background: rgba(255, 255, 255, .7); border-radius: 0 3px 3px 0; transition: width .5s linear; }

/* code de sauvegarde */
.code { display: block; width: 100%; min-height: 84px; margin: 0 0 10px; padding: 10px 12px; border: 2px solid var(--ligne); border-radius: 14px; background: #fff; color: var(--texte-2); font: 600 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; resize: none; -webkit-appearance: none; }
.code:focus { outline: none; border-color: var(--lavande); }

/* le critique : les cartes à lui servir */
.carte.gouter { position: relative; box-shadow: 0 0 0 3px var(--lavande), 0 6px 16px rgba(154, 132, 240, .3); }
.carte.gouter .icone { background: #EFEAFF; }
.badge-critique { position: absolute; top: -9px; left: 14px; z-index: 1; background: var(--lavande-sombre); color: #fff; font: 800 11px/1 var(--texte-font); padding: 5px 9px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }

/* le boulanger et ses talents */
.boulanger-tete { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.boulanger-tete > svg { width: 76px; height: 76px; flex: 0 0 auto; background: var(--peche); border-radius: 24px; padding: 6px; }
.boulanger-tete h2 { margin: 0 0 2px; }
.boulanger-tete .sous { margin: 0 0 6px; }
.mini.xp i { background: var(--lavande-sombre); }
.titre-section { margin: 16px 0 8px; font: 700 16px/1.2 var(--titre); }
.titre-section .pts { color: var(--lavande-sombre); }
.crans { font-size: 12px; color: var(--lavande-sombre); letter-spacing: 1px; white-space: nowrap; }
.am.talent em { font-style: normal; color: var(--lavande-sombre); font-size: 12px; }
.am.talent.appris { box-shadow: 0 0 0 2px var(--lavande), 0 4px 12px var(--ombre); }

/* le nom de la boutique */
.champ { display: block; width: 100%; padding: 12px 14px; border: 2px solid var(--ligne); border-radius: 14px; background: #fff; color: var(--texte); font: 800 16px/1.2 var(--texte-font); -webkit-appearance: none; appearance: none; }
.champ:focus { outline: none; border-color: var(--beurre); }

/* pain du jour, spécialité, défi de la semaine, journal, trophées */
.tag { display: inline-block; margin-left: 4px; padding: 2px 7px; border-radius: 999px; background: var(--beurre); color: var(--texte); font: 800 10px/1.3 var(--texte-font); vertical-align: middle; white-space: nowrap; }
.tag.spe { background: var(--lavande); }
.obj-extra { margin: -2px 0 6px; font: 700 12px/1.3 var(--texte-font); color: var(--texte-2); }
.obj-extra b { color: var(--texte); }
.am.pain { grid-template-columns: 44px minmax(0, 1fr); }
.am.pain > svg { width: 44px; height: 44px; background: var(--peche); border-radius: 14px; padding: 4px; }
.spe-grille { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 4px; }
.spe-grille button { display: grid; place-items: center; gap: 2px; padding: 8px 4px 6px; border-radius: 16px; background: var(--carte); box-shadow: 0 3px 8px var(--ombre); font: 700 11px/1.1 var(--texte-font); color: var(--texte-2); }
.spe-grille button svg { width: 36px; height: 36px; }
.spe-grille button.actif { outline: 3px solid var(--lavande-sombre); color: var(--texte); background: #EFEAFF; }
.am.habitue { grid-template-columns: 18px minmax(0, 1fr); }
.pastille-hab { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .6); }
.trophees { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.troph { padding: 10px 12px; border-radius: 16px; background: var(--gris); color: var(--gris-texte); }
.troph.gagne { background: #FFF3C4; color: var(--texte); box-shadow: 0 3px 8px var(--ombre); }
.troph b { display: block; font: 700 13px/1.2 var(--titre); margin-bottom: 2px; }
.troph span { font-size: 11px; line-height: 1.3; }
.carnet { display: grid; gap: 6px; }

<script>
/* ── game.js ── */
/* LE FOURNIL — économie, état, absence, étoiles, objectifs du jour, événements. Aucune dépendance au DOM : tourne aussi dans Node. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.GAME = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ─── les produits, dans l'ordre où on les débloque ───
  const PRODUITS = [
    { id: 'baguette', pl: 'baguettes', nom: 'Baguette', cout: 4, rev: 1, temps: 1, croiss: 1.07, staff: 1000, staffNom: 'Apprenti Léo', desc: 'Croustillante, chaude, la base.' },
    { id: 'croissant', pl: 'croissants', nom: 'Croissant', cout: 60, rev: 20, temps: 3, croiss: 1.15, staff: 15000, staffNom: 'Apprentie Inès', desc: 'Pur beurre, feuilleté.' },
    { id: 'painchoc', pl: 'pains au chocolat', nom: 'Pain au chocolat', cout: 720, rev: 150, temps: 6, croiss: 1.14, staff: 100000, staffNom: 'Mitron Sami', desc: 'Deux barres, pas une.' },
    { id: 'tarte', pl: 'tartes aux pommes', nom: 'Tarte aux pommes', cout: 8640, rev: 1200, temps: 12, croiss: 1.13, staff: 500000, staffNom: 'Pâtissière Rose', desc: 'La recette de mamie.' },
    { id: 'eclair', pl: 'éclairs au café', nom: 'Éclair au café', cout: 2e7, rev: 10000, temps: 24, croiss: 1.12, staff: 8e7, staffNom: 'Pâtissier Malik', desc: 'Glacé, fondant, parfait.' },
    { id: 'macaron', pl: 'macarons', nom: 'Macarons', cout: 1e9, rev: 90000, temps: 96, croiss: 1.11, staff: 4e9, staffNom: 'Cheffe Agathe', desc: 'Six parfums, zéro regret.' },
    { id: 'millefeuille', pl: 'mille-feuilles', nom: 'Mille-feuille', cout: 5e10, rev: 8e5, temps: 384, croiss: 1.1, staff: 2e11, staffNom: 'Chef Augustin', desc: 'Mille, on a compté.' },
    { id: 'piece', pl: 'pièces montées', nom: 'Pièce montée', cout: 4e12, rev: 7e6, temps: 1536, croiss: 1.09, staff: 1.6e13, staffNom: 'Maître Paulin', desc: 'Pour les grands jours.' },
  ];
  const PALIERS = [25, 50, 100, 200, 300, 400, 500, 750, 1000, 1500, 2000, 3000, 5000];
  const AMELIORATIONS = [
    { id: 'farine', nom: 'Farine de tradition', cout: 25000, cible: ['baguette'], mult: 3, desc: 'Baguettes ×3' },
    { id: 'beurre', nom: 'Beurre AOP', cout: 300000, cible: ['croissant'], mult: 3, desc: 'Croissants ×3' },
    { id: 'enseigne', nom: 'Enseigne lumineuse', cout: 1.5e6, cible: null, mult: 2, desc: 'Tout ×2' },
    { id: 'chocolat', nom: 'Chocolat noir 70 %', cout: 4e6, cible: ['painchoc'], mult: 3, desc: 'Pains au chocolat ×3' },
    { id: 'pommes', nom: 'Pommes du verger', cout: 4e7, cible: ['tarte'], mult: 3, desc: 'Tartes ×3' },
    { id: 'four', nom: 'Four à sole', cout: 1e8, cible: ['baguette', 'croissant'], mult: 5, desc: 'Baguettes et croissants ×5' },
    { id: 'terrasse', nom: 'Terrasse ensoleillée', cout: 2.5e8, cible: null, mult: 2, desc: 'Tout ×2' },
    { id: 'cafe', nom: 'Café torréfié maison', cout: 2e9, cible: ['eclair'], mult: 3, desc: 'Éclairs ×3' },
    { id: 'amandes', nom: 'Amandes de Provence', cout: 5e10, cible: ['macaron'], mult: 3, desc: 'Macarons ×3' },
    { id: 'vitrine', nom: 'Vitrine réfrigérée', cout: 2e11, cible: ['tarte', 'eclair', 'macaron'], mult: 5, desc: 'Tartes, éclairs, macarons ×5' },
    { id: 'fidelite', nom: 'Carte de fidélité', cout: 1e12, cible: null, mult: 3, desc: 'Tout ×3' },
    { id: 'feuilletage', nom: 'Pâte feuilletée maison', cout: 5e12, cible: ['millefeuille'], mult: 3, desc: 'Mille-feuilles ×3' },
    { id: 'robot', nom: 'Robot pâtissier', cout: 5e13, cible: ['piece'], mult: 3, desc: 'Pièces montées ×3' },
    { id: 'franchise', nom: 'Réseau de franchises', cout: 5e14, cible: null, mult: 5, desc: 'Tout ×5' },
  ];
  const ETOILE_BONUS = 0.05;     // +5 % par étoile, pour toujours
  const ETOILE_BASE = 3e9;       // la première étoile demande ~3 Md € gagnés dans la boutique
  const ETOILE_FREIN = 25;       // chaque tranche de 25 étoiles possédées rend les suivantes 2 fois plus chères (pas d'emballement)
  const ABSENCE_MAX_H = 8;       // les apprentis travaillent 8 h au plus pendant une absence
  const RUSH = { duree: 60, mult: 3 };          // coup de feu : toutes les ventes ×3 pendant 60 s
  const COMMANDE = { duree: 180, prime: 6 };    // commande spéciale : N fournées en 3 min, payées 6 fois le prix
  const CRITIQUE = { duree: 120, mult: 2, boost: 300 }; // le critique : vends trois recettes différentes en 2 min → tout ×2 pendant 5 min
  const MEUNIER = { duree: 90, remise: 0.4 };   // le meunier passe : niveaux et recettes à −40 % pendant 90 s
  const PETRISSAGE = { duree: 20, n: 30 };      // concours de pétrissage : 30 touches en 20 s → prime
  const PANNE = { duree: 60, n: 8 };            // panne de four : un produit à l'arrêt ; 8 touches pour réparer (prime), sinon réparé seul après 60 s
  const ANNIVERSAIRE = { duree: 120, mult: 5 }; // goûter d'anniversaire : un produit ×5 pendant 2 min
  const EVENEMENTS = { rush: RUSH, commande: COMMANDE, critique: CRITIQUE, meunier: MEUNIER, petrissage: PETRISSAGE, panne: PANNE, anniversaire: ANNIVERSAIRE };
  const MARCHE_MULT = 1.5;                      // jour de marché (samedi, dimanche) : ×1,5
  const PAIN_DU_JOUR_MULT = 1.5;                // le pain du jour : un produit ×1,5 toute la journée
  const SPECIALITE_MULT = 2;                    // la spécialité de la boutique : un produit ×2 le temps de la boutique

  // ─── les quartiers : chaque nouvelle boutique change de décor ; le nom de la boutique ; les saisons selon la date réelle ───
  const QUARTIERS = [
    { id: 'village', nom: 'le village', enseigne: 'Au Fournil du Village' },
    { id: 'paris', nom: 'le coin de rue parisien', enseigne: 'Le Fournil de la Rue' },
    { id: 'mer', nom: 'le bord de mer', enseigne: 'Le Fournil de la Plage' },
    { id: 'montagne', nom: 'le chalet de montagne', enseigne: 'Le Fournil du Chalet' },
    { id: 'ville', nom: 'la grande ville', enseigne: 'Le Grand Fournil' },
  ];
  const inc = (st, k, n) => { st.stats[k] = (st.stats[k] || 0) + (n == null ? 1 : n); };
  const quartier = (st) => (Math.max(1, st.boutiques || 1) - 1) % QUARTIERS.length;
  const nomBoutique = (st) => st.nomBoutique || QUARTIERS[quartier(st)].enseigne;
  function renommer(st, nom) { const n = String(nom || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 24); st.nomBoutique = n; return nomBoutique(st); }
  function saison(ms) {
    const d = new Date(ms), m = d.getMonth() + 1, j = d.getDate(), tags = [];
    if (m === 12 || m <= 2) tags.push('neige');
    if (m === 12) tags.push('noel');
    if (m === 1 && j <= 20) tags.push('galette');
    if (m === 2 && j >= 10 && j <= 15) tags.push('coeurs');
    if (m === 4) tags.push('paques');
    if (m >= 6 && m <= 8) tags.push('ete');
    if (m === 7 && j >= 10 && j <= 16) tags.push('fete');
    if (m === 10 && j >= 15) tags.push('halloween');
    if (m === 10 || m === 11) tags.push('feuilles');
    return tags;
  }

  // ─── le boulanger : savoir-faire, niveaux, titres et talents permanents (rien de tout ça ne se perd en changeant de boutique) ───
  const TITRES = [[1, 'Apprenti'], [4, 'Mitron'], [8, 'Boulanger'], [13, 'Compagnon'], [19, 'Maître boulanger'], [26, 'Meilleur Ouvrier de France']];
  const XP_NIVEAU = (n) => Math.round(40 * Math.pow(n, 1.4)); // savoir-faire pour passer du niveau n au suivant
  const TALENTS = [
    { id: 'affluence', nom: 'Bouche-à-oreille', max: 4, desc: (k) => `Les fournées cuites à la main servent plus de clients : ×${1 + k * 0.5}`.replace('.', ',') },
    { id: 'mains', nom: 'Mains rapides', max: 5, desc: (k) => `Toutes les fournées cuisent ${k * 5} % plus vite` },
    { id: 'memoire', nom: 'Mémoire des recettes', max: 4, desc: (k) => `Chaque nouvelle boutique démarre avec ${k + 1} recette${k ? 's' : ''}` },
    { id: 'levetot', nom: 'Lève-tôt', max: 4, desc: (k) => `Les apprentis travaillent ${ABSENCE_MAX_H + k} h pendant ton absence` },
    { id: 'zele', nom: 'Apprentis zélés', max: 4, desc: (k) => `Embauches ${k * 10} % moins chères` },
    { id: 'negoce', nom: 'Négociateur', max: 4, desc: (k) => `Bonus ${k * 8} % moins chers` },
    { id: 'charme', nom: 'Charme', max: 3, desc: (k) => `Événements ${k * 12} % plus fréquents, primes +${k * 25} %` },
    { id: 'pourboire', nom: 'Pourboires', max: 3, desc: (k) => `Client mystère ${k * 50} % plus généreux, ${k * 15} % plus fréquent` },
    { id: 'carnet', nom: 'Carnet de commandes', max: 3, desc: (k) => `Primes des défis du jour +${k * 50} %` },
  ];
  const talent = (st, id) => (st.talents && st.talents[id]) || 0;
  function niveauPour(xp) { let n = 1, reste = Math.max(0, xp || 0); while (reste >= XP_NIVEAU(n)) { reste -= XP_NIVEAU(n); n++; } return { n, reste, prochain: XP_NIVEAU(n) }; }
  const niveau = (st) => niveauPour(st.xp).n;
  function titre(st) { const n = niveau(st); let t = TITRES[0]; for (const x of TITRES) if (n >= x[0]) t = x; return t[1]; }
  const rangTitre = (st) => { const n = niveau(st); let r = 0; TITRES.forEach((x, k) => { if (n >= x[0]) r = k; }); return r; };
  const ptsTalents = (st) => Math.max(0, niveau(st) - 1 - Object.values(st.talents || {}).reduce((a, b) => a + b, 0));
  function gagnerXp(st, n) { const avant = niveau(st); st.xp = (st.xp || 0) + n; return { xp: n, niveau: niveau(st), monte: niveau(st) > avant }; }
  function apprendre(st, id) {
    const t = TALENTS.find((x) => x.id === id);
    if (!t || talent(st, id) >= t.max || ptsTalents(st) <= 0) return { ok: false };
    st.talents = st.talents || {}; st.talents[id] = talent(st, id) + 1;
    return { ok: true, cran: st.talents[id], talent: t };
  }
  // effets des talents
  const tempsMult = (st) => 1 - 0.05 * talent(st, 'mains');
  const temps = (st, i) => PRODUITS[i].temps * tempsMult(st);
  const heuresAbsence = (st) => ABSENCE_MAX_H + talent(st, 'levetot');
  const affluenceMult = (st) => 1 + 0.5 * talent(st, 'affluence');
  const prixStaff = (st, i) => PRODUITS[i].staff * (1 - 0.1 * talent(st, 'zele'));
  const prixBonus = (st, a) => a.cout * (1 - 0.08 * talent(st, 'negoce'));
  const primeMult = (st) => 1 + 0.25 * talent(st, 'charme');

  // ─── état ───
  function stationsNeuves(ouvertes) { const n = Math.max(1, ouvertes || 1); return PRODUITS.map((p, i) => ({ niv: i < n ? 1 : 0, staff: false, prog: 0, actif: false })); }
  function newState(nowMs) {
    return {
      v: 2, coins: 0, lifetime: 0, lifetimeRun: 0, etoiles: 0, boutiques: 1, xp: 0, talents: {}, nomBoutique: '',
      stations: stationsNeuves(), ameliorations: {}, tuto: 0, lastSeen: nowMs, created: nowMs, son: true, vibre: true, mode: 1, now: nowMs,
      stats: { taps: 0, ventes: 0, clients: 0, embauches: 0, commandes: 0, critiques: 0, petrissages: 0, pannes: 0, pourboires: 0, petrissageRecord: 0, meilleurPourboire: 0, meilleureCommande: 0, serieMax: 0, semaines: 0, recetteMax: 0, franchise: false },
      jour: null, serie: 0, dernierJourComplet: '', ev: null, evTimer: 180, dernierEv: '', boost: null, mystereTimer: 150, carnetEv: [],
      semaine: null, trophees: {}, habitues: {}, specialite: null,
    };
  }

  // ─── temps, hasard déterministe ───
  const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const hier = (ms) => dayKey(ms - 864e5);
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const jourDeMarche = (ms) => { const d = new Date(ms).getDay(); return d === 0 || d === 6; };
  const heureDePointe = (ms) => { const h = new Date(ms).getHours(); return (h >= 7 && h < 9) || (h >= 12 && h < 14) || (h >= 17 && h < 19); };
  function arrondi(n) { if (n < 10) return Math.max(1, Math.round(n)); const p = Math.pow(10, Math.floor(Math.log10(n)) - 1); return Math.round(n / p) * p; }

  // ─── calculs ───
  const palierMult = (niv) => Math.pow(2, PALIERS.filter((p) => niv >= p).length);
  const prochainPalier = (niv) => PALIERS.find((p) => p > niv) || null;
  function ameliorationMult(st, i) {
    let m = 1;
    for (const a of AMELIORATIONS) if (st.ameliorations[a.id] && (a.cible === null || a.cible.includes(PRODUITS[i].id))) m *= a.mult;
    return m;
  }
  const etoileMult = (st) => 1 + st.etoiles * ETOILE_BONUS;
  function boostMult(st, i) { // événements et bonus temporaires, à l'instant st.now (i : pour les bonus propres à un produit)
    let m = 1;
    const ev = st.ev;
    if (ev && ev.fin > st.now) { if (ev.type === 'rush') m *= RUSH.mult; if (ev.type === 'anniversaire' && i != null && ev.i === i) m *= ANNIVERSAIRE.mult; }
    if (i != null && st.jour && st.jour.pain === i) m *= PAIN_DU_JOUR_MULT; // le pain du jour
    if (i != null && st.specialite === i) m *= SPECIALITE_MULT;   // la spécialité de la boutique
    if (st.boost && st.boost.fin > st.now) m *= st.boost.mult;
    if (jourDeMarche(st.now)) m *= MARCHE_MULT;
    return m;
  }
  function revenuBase(st, i) { const s = st.stations[i]; return s.niv <= 0 ? 0 : PRODUITS[i].rev * s.niv * palierMult(s.niv) * ameliorationMult(st, i) * etoileMult(st); }
  function revenu(st, i) { return revenuBase(st, i) * boostMult(st, i); } // par fournée, maintenant
  const coutNiveau = (i, niv) => PRODUITS[i].cout * Math.pow(PRODUITS[i].croiss, niv);
  function coutNiveaux(i, niv, n) { const r = PRODUITS[i].croiss; return PRODUITS[i].cout * Math.pow(r, niv) * (Math.pow(r, n) - 1) / (r - 1); }
  function maxNiveaux(i, niv, coins) { const r = PRODUITS[i].croiss, a = PRODUITS[i].cout * Math.pow(r, niv); if (coins < a) return 0; return Math.floor(Math.log(coins * (r - 1) / a + 1) / Math.log(r)); }
  const remise = (st) => (st.ev && st.ev.type === 'meunier' && st.ev.fin > st.now ? 1 - MEUNIER.remise : 1); // le meunier : tout moins cher
  const prixNiveaux = (st, i, n) => coutNiveaux(i, st.stations[i].niv, n) * remise(st); // prix réel maintenant (remise comprise)
  function quantite(st, i) {
    const s = st.stations[i];
    if (s.niv === 0) return 1;
    if (st.mode === 'max') return Math.max(1, maxNiveaux(i, s.niv, st.coins / remise(st)));
    return st.mode;
  }
  function tauxParSeconde(st) { let t = 0; st.stations.forEach((s, i) => { if (s.staff && s.niv > 0) t += revenu(st, i) / temps(st, i); }); return t; }
  function tauxBase(st) { let t = 0; st.stations.forEach((s, i) => { if (s.staff && s.niv > 0) t += revenuBase(st, i) / temps(st, i); }); return t; }
  // ce que rapporte une fournée maintenant : à la main, le bouche-à-oreille sert plus de clients
  const revenuFournee = (st, i) => revenu(st, i) * (st.stations[i].staff ? 1 : affluenceMult(st));
  // rythme de référence pour calibrer objectifs et primes : les apprentis, sinon la première fournée à la main
  function rythme(st) { const t = tauxBase(st); if (t > 0) return t; let best = 0; st.stations.forEach((s, i) => { if (s.niv > 0) best = Math.max(best, revenuBase(st, i) / Math.max(1, temps(st, i)) * 0.5); }); return Math.max(0.5, best); }
  function etoilesPour(lifetimeRun, etoiles) { return Math.floor(Math.sqrt(Math.max(0, lifetimeRun) / (ETOILE_BASE * (1 + (etoiles || 0) / ETOILE_FREIN)))); }
  const etoilesGagnables = (st) => Math.max(0, etoilesPour(st.lifetimeRun, st.etoiles));

  // ─── objectifs du jour : trois par jour, tirés de la date, calibrés sur ta boutique ───
  const TYPES_OBJ = {
    gagner: (st, r) => ({ cible: arrondi(Math.max(50, r * 1500)), txt: (c) => `Gagne ${fmtEur(c)}` }),
    // vendre : dix minutes de production d'un produit rapide (les ventes pendant l'absence ne comptent pas)
    vendre: (st, r, rnd) => { const idx = st.stations.map((s, i) => i).filter((i) => st.stations[i].niv > 0 && PRODUITS[i].temps <= 120); if (!idx.length) return null; const i = idx[Math.floor(rnd() * idx.length)]; const s = st.stations[i]; const n = Math.max(2, Math.min(s.staff ? 600 : 40, arrondi(600 / PRODUITS[i].temps * (s.staff ? 1 : 0.4)))); return { i, cible: n, txt: (c) => `Vends ${fmt(c)} fournées de ${PRODUITS[i].pl}` }; },

            ${s.staff ? `<div class="staff-ok">${ICONS.apprenti(i)}<span>${esc(p.staffNom.split(' ').pop())}<br>s’en occupe</span></div>` : `<button type="button" class="btn beurre ${st.coins >= G.prixStaff(st, i) ? '' : 'non'}" data-a="embaucher"><small>Embaucher</small><b>${G.fmtEur(G.prixStaff(st, i))}</b></button>`}</div>`;
      }

      if (c.bar && !c.bar.classList.contains('rapide')) c.bar.style.width = (s.niv > 0 && s.actif ? Math.min(100, s.prog / G.temps(st, i) * 100) : 0).toFixed(1) + '%';

  function onCardClick(e) {

      const a = btn.dataset.a;
      if (a === 'debloquer' || a === 'ameliorer') {
        const r = G.acheter(st, i);
        if (!r.ok) { son.non(); toast(`Il manque ${G.fmtEur(r.prix - st.coins)}`); return; }
        if (a === 'debloquer') { son.deblocage(); buzz([10, 30, 10]); SCENE.fete(); toast(`${G.PRODUITS[i].nom} : nouvelle recette !`); } else { son.achat(); buzz(8); }
        renderCards(true); hud(); save(); return;
      }
      if (a === 'embaucher') {
        const r = G.embaucher(st, i);
        if (!r.ok) { son.non(); toast(`Il manque ${G.fmtEur(r.prix - st.coins)}`); return; }

        renderCards(true); hud(); save(); return;

    }
    if (st.ev && st.ev.type === 'critique' && st.ev.restants.includes(i)) { // on sert le critique
      const r = G.servir(st, i); if (!r.ok) return;

      else { son.achat(); buzz(8); toast(`Le critique goûte… encore ${r.restants} recette${r.restants > 1 ? 's' : ''}.`); renderCards(true); }

  // ─── en-tête ───
  function hud() {
    const taux = G.tauxParSeconde(st), gain = G.etoilesGagnables(st), marche = G.jourDeMarche(st.now), boost = st.boost && st.boost.fin > st.now ? st.boost.mult : 0;
    const key = `${G.fmtEur(st.coins)}|${G.fmtEur(taux)}|${st.etoiles}|${gain}|${marche}|${boost}`;
    if (key === lastHud) return; lastHud = key;
    $('#coins').textContent = G.fmtEur(st.coins);
    $('#taux').innerHTML = (taux > 0 ? `<b>+${G.fmtEur(taux)}</b> par seconde` : 'Touche la baguette !') + (marche || boost ? '<br>' : '') + (marche ? '<span class="marche">Marché ×1,5</span>' : '') + (boost ? `<span class="marche">Bonne critique ×${boost}</span>` : '');
    $('#etoiles-n').textContent = gain > 0 ? `${st.etoiles} · +${gain}` : st.etoiles;
    $('#b-etoiles').classList.toggle('pret', gain >= 3);
    $('#b-ameliorations').classList.toggle('pret', G.AMELIORATIONS.some((a) => !st.ameliorations[a.id] && st.coins >= G.prixBonus(st, a)));
  }
  function toast(txt) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = txt; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2400); }
  function flottant(x, y, txt) { const el = document.createElement('div'); el.className = 'flottant'; el.textContent = txt; el.style.left = x + 'px'; el.style.top = y + 'px'; document.body.appendChild(el); setTimeout(() => el.remove(), 900); }

  // ─── événements : sept cartes, une interaction différente chacune ───
  const TXT_EV = { rush: 'Coup de feu : les clients affluent !', commande: 'Un client passe une commande spéciale !', critique: 'Le critique gastronomique entre dans la boutique !', meunier: 'Le meunier passe : tout à −40 % !', petrissage: 'Concours de pétrissage : touche vite !', panne: 'Un four tombe en panne !', anniversaire: 'Un goûter d’anniversaire dans la boutique !' };
  const FIN_EV = { rush: 'Le coup de feu est passé.', commande: 'Trop tard, le client reviendra une autre fois.', critique: 'Le critique est reparti sans conclure…', meunier: 'Le meunier est reparti.', petrissage: 'Trop tard, la pâte a trop levé.', panne: 'Le four s’est réparé tout seul.', anniversaire: 'Le goûter est terminé.' };
  const Maj = (t) => t.charAt(0).toUpperCase() + t.slice(1);

  function renderEvenement() {

      const chrono = '<b class="ev-chrono"></b>', barre = '<i class="ev-barre"></i>';
      const html = {
        rush: () => `<div class="ev rush">${ICONS.FEU}<div class="ev-txt"><b>Coup de feu !</b><span>Toutes les ventes ×${G.RUSH.mult}</span></div>${chrono}${barre}</div>`,

        meunier: () => `<div class="ev meunier">${ICONS.SAC}<div class="ev-txt"><b>Le meunier passe</b><span>Niveaux et recettes à −${Math.round(G.MEUNIER.remise * 100)} % : c’est le moment d’acheter !</span></div>${chrono}${barre}</div>`,
        petrissage: () => `<div class="ev petrissage">${ICONS.PATE}<div class="ev-txt"><b>Concours de pétrissage</b><span>${ev.n} touches en ${G.PETRISSAGE.duree} s · prime <b>${G.fmtEur(ev.prime)}</b></span></div><button type="button" class="btn tapote" data-a="petrir"><small>Pétris !</small><b class="ev-compte">0/${ev.n}</b></button>${barre}</div>`,
        panne: () => `<div class="ev panne">${ICONS.PANNE}<div class="ev-txt"><b>Panne de four !</b><span>${esc(Maj(p.pl))} à l’arrêt · répare pour <b>${G.fmtEur(ev.prime)}</b></span></div><button type="button" class="btn tapote" data-a="reparer"><small>Répare !</small><b class="ev-compte">0/${ev.n}</b></button>${barre}</div>`,
        anniversaire: () => `<div class="ev anniversaire">${ICONS.BALLON}<div class="ev-txt"><b>Goûter d’anniversaire</b><span>${esc(Maj(p.pl))} ×${ev.mult}${st.stations[ev.i].staff ? '' : ' · touche pour cuire !'}</span></div>${chrono}${barre}</div>`,
      };

      const reparer = box.querySelector('[data-a="reparer"]');
      if (reparer) reparer.addEventListener('pointerdown', (e) => { e.preventDefault(); audio(); const r = G.reparer(st); if (!r.ok) return; son.tap(); buzz(8); if (r.fini) reussite(`Four réparé : +${G.fmtEur(r.prime)}`); else reparer.querySelector('.ev-compte').textContent = `${r.coups}/${ev.n}`; });
    }
    const prog = box.querySelector('.ev-prog');

    if (prog && ev.type === 'critique') prog.textContent = 'Touche les cartes : ' + ev.restants.map((i) => G.PRODUITS[i].nom.toLowerCase()).join(', ');

  // ─── indices : une seule consigne à la fois, qui pointe l'élément concerné ───
  const INDICES = [
    { txt: 'Touche la baguette pour la cuire et la vendre !', cible: () => cards[0].el.querySelector('.barre'), fini: () => st.stats.ventes >= 1 },
    { txt: 'Avec tes euros, améliore la baguette : chaque niveau rapporte plus.', cible: () => cards[0].el.querySelector('[data-a="ameliorer"]'), pret: () => st.coins >= G.coutNiveau(0, st.stations[0].niv), fini: () => st.stations[0].niv >= 2 },
    { txt: 'Débloque les croissants : 20 € la fournée !', cible: () => cards[1].el.querySelector('[data-a="debloquer"]'), pret: () => st.coins >= G.PRODUITS[1].cout, fini: () => st.stations[1].niv >= 1 },
    { txt: 'Embauche Léo : il cuit les baguettes tout seul, même quand tu n’es pas là.', cible: () => cards[0].el.querySelector('[data-a="embaucher"]'), pret: () => st.coins >= G.PRODUITS[0].staff, fini: () => st.stations[0].staff },
    { txt: 'Bravo ! Au niveau 25, 50, 100… les gains doublent. Et regarde tes objectifs du jour : trois défis, une étoile à la clé.', cible: () => $('#objectifs'), pret: () => true, fini: () => performance.now() > hintUntil },
    { txt: 'Le boulanger a un point de talent ! Touche-le dans la boutique pour l’apprendre.', cible: () => $('#scene'), pret: () => G.ptsTalents(st) > 0, fini: () => vuBoulanger },
  ];
  function indices() {
    const el = $('#indice');
    if (st.tuto >= INDICES.length || !$('#feuille').hidden) { el.hidden = true; return; }
    const h = INDICES[st.tuto];
    if (h.fini()) { st.tuto++; hintUntil = performance.now() + 8000; save(); el.hidden = true; return; }
    if (h.pret && !h.pret()) { el.hidden = true; return; }
    if (st.tuto !== hintStep) { hintStep = st.tuto; $('#indice-txt').textContent = h.txt; if (st.tuto === 4) hintUntil = performance.now() + 8000; }
    const cible = h.cible();
    el.hidden = false;
    if (!cible) { el.classList.remove('haut'); el.style.left = '50%'; el.style.transform = 'translateX(-50%)'; el.style.top = (window.innerHeight * 0.42) + 'px'; el.querySelector('.main').hidden = true; return; }
    el.querySelector('.main').hidden = false;
    const r = cible.getBoundingClientRect(), bw = Math.min(window.innerWidth * 0.78, 320);
    let x = r.left + r.width / 2 - bw / 2; x = Math.max(8, Math.min(window.innerWidth - bw - 8, x));
    el.style.left = x + 'px'; el.style.transform = 'none';
    const hauteur = el.offsetHeight || 90;
    if (r.bottom + hauteur + 6 < window.innerHeight - 20) { el.classList.add('haut'); el.style.top = (r.bottom + 6) + 'px'; }
    else { el.classList.remove('haut'); el.style.top = (r.top - hauteur - 6) + 'px'; }
    if (r.bottom < 0 || r.top > window.innerHeight) el.hidden = true;
  }

  function sheetAmeliorations() {

  function sheetSauvegarde() {

    openSheet(`<h2>Sauvegarde</h2><p class="sous">Ta boutique est enregistrée ici toutes les 5 secondes et à chaque achat. Attention : Safari et l’app installée ont chacun leur sauvegarde, et supprimer l’app efface la sienne. Pour la mettre à l’abri ou la transférer, copie ce code et garde-le quelque part.</p>

      openSheet(`<h2>Charger cette boutique ?</h2><p class="sous">Ta boutique actuelle : ${G.fmtEur(st.coins)}, ${st.etoiles} étoile${st.etoiles > 1 ? 's' : ''}, boutique n°${st.boutiques}. Dans le code :</p>
