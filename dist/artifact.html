<title>Le Fournil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap">
<style>
/* LE FOURNIL — lumineux et doux : crème, fraise, beurre, menthe ; formes rondes, gros chiffres, boutons à épaisseur. */
:root {
  --creme: #FFF7EC; --carte: #FFFFFF; --texte: #4A3328; --texte-2: #8C6F62; --ligne: #F0E4D8;
  --fraise: #FF6B8B; --fraise-sombre: #E1496C; --beurre: #FFC84A; --beurre-sombre: #E0A61E; --menthe: #5FD3A4; --menthe-sombre: #3FB889;
  --lavande: #B8A6FF; --lavande-sombre: #9A84F0; --peche: #FFE0C7; --gris: #EADFD6; --gris-texte: #B5A49A; --gris-sombre: #D9CCC2;
  --ombre: rgba(74, 51, 40, .10);
  --titre: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
  --texte-font: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--creme); color: var(--texte); overflow: hidden; }
body { font: 700 15px/1.35 var(--texte-font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--lavande); outline-offset: 2px; }
#probe { position: fixed; left: -9999px; top: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
svg { display: block; }

/* ─── en-tête ─── */
#haut { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px 6px; }
.solde { display: flex; align-items: center; gap: 10px; min-width: 0; }
.solde .piece { width: 40px; height: 40px; flex: 0 0 auto; }
.solde b { display: block; font: 700 clamp(26px, 7.6vw, 34px)/1 var(--titre); letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.solde small { display: block; margin-top: 2px; font-size: 13px; color: var(--texte-2); white-space: nowrap; }
.solde small b { display: inline; font: 800 13px/1 var(--texte-font); color: var(--menthe-sombre); }
.haut-btns { display: flex; gap: 8px; flex: 0 0 auto; }
.pastille { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 999px; background: var(--carte);
  box-shadow: 0 3px 0 var(--gris-sombre); font: 700 16px/1 var(--titre); color: var(--texte); }
.pastille:active { transform: translateY(3px); box-shadow: none; }
.pastille svg { width: 22px; height: 22px; }
.pastille.etoile { background: var(--beurre); box-shadow: 0 3px 0 var(--beurre-sombre); }
.pastille.etoile.pret { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ─── scène ─── */
#scene { flex: 0 0 auto; width: 100%; display: block; touch-action: none; }

/* ─── liste des produits ─── */
#liste { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 24px); }
.barre-achat { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 8px 2px 10px; background: var(--creme); }
.barre-achat .modes { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--carte); box-shadow: 0 3px 0 var(--gris-sombre); }
.barre-achat .modes button { min-width: 42px; min-height: 38px; padding: 0 8px; border-radius: 999px; font: 700 14px/1 var(--titre); color: var(--texte-2); }
.barre-achat .modes button.actif { background: var(--texte); color: #fff; }
.btn-am { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 999px; background: var(--lavande); color: #fff;
  box-shadow: 0 3px 0 var(--lavande-sombre); font: 700 14px/1 var(--titre); white-space: nowrap; }
.btn-am:active { transform: translateY(3px); box-shadow: none; }
.btn-am svg { width: 18px; height: 18px; }
.btn-am.pret { animation: pulse 1.2s ease-in-out infinite; }
#cartes { display: grid; gap: 10px; }
.carte { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px; border-radius: 22px; background: var(--carte);
  box-shadow: 0 6px 16px var(--ombre); position: relative; }
.carte .icone { width: 60px; height: 60px; border-radius: 18px; background: var(--peche); display: grid; place-items: center; }
.carte .icone svg { width: 46px; height: 46px; }
.carte .corps { min-width: 0; display: grid; gap: 6px; }
.carte h3 { margin: 0; font: 700 18px/1.1 var(--titre); letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.carte h3 .niv { font: 800 12px/1 var(--texte-font); color: var(--texte-2); padding: 3px 7px; border-radius: 999px; background: var(--creme); white-space: nowrap; }
.carte h3 .niv i { font-style: normal; color: var(--gris-texte); }
.carte .barre { position: relative; height: 30px; border-radius: 999px; background: var(--creme); overflow: hidden; }
.carte .barre i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: var(--menthe); }
.carte .barre i.rapide { background: linear-gradient(90deg, var(--menthe), var(--menthe-sombre)); width: 100% !important; }
.carte .barre span { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font: 800 13px/1 var(--texte-font); white-space: nowrap; }
.carte .barre .rev { left: 10px; color: var(--texte); }
.carte .barre .tps { right: 10px; color: var(--texte-2); font-weight: 700; }
.carte .barre .cuire { right: 10px; color: var(--fraise-sombre); font: 700 13px/1 var(--titre); letter-spacing: .02em; }
.carte.manuel:not(.actif) .barre { outline: 2px dashed var(--fraise); outline-offset: -2px; }
.carte.manuel:not(.actif):active .barre { background: #FFE9EE; }
.boutons { display: grid; gap: 6px; width: 118px; }
.btn { display: grid; justify-items: center; gap: 2px; min-height: 48px; padding: 6px 8px; border-radius: 16px; background: var(--fraise); color: #fff; box-shadow: 0 4px 0 var(--fraise-sombre); transition: transform .05s; }
.btn small { font: 700 11px/1 var(--texte-font); opacity: .9; letter-spacing: .02em; }
.btn b { font: 700 16px/1 var(--titre); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn.menthe { background: var(--menthe); box-shadow: 0 4px 0 var(--menthe-sombre); }
.btn.beurre { background: var(--beurre); color: var(--texte); box-shadow: 0 4px 0 var(--beurre-sombre); }
.btn.lavande { background: var(--lavande); box-shadow: 0 4px 0 var(--lavande-sombre); }
.btn.non { background: var(--gris); color: var(--gris-texte); box-shadow: 0 4px 0 var(--gris-sombre); }
.btn.non:active { transform: none; box-shadow: 0 4px 0 var(--gris-sombre); }
.btn.large { width: 100%; min-height: 56px; border-radius: 20px; }
.btn.large b { font-size: 19px; }
.staff-ok { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 8px; border-radius: 14px; background: var(--creme); font: 700 12px/1.15 var(--texte-font); color: var(--texte-2); }
.staff-ok svg { width: 28px; height: 28px; flex: 0 0 auto; }
.carte.verrou { grid-template-columns: 60px minmax(0, 1fr); background: #FFFBF4; box-shadow: none; border: 2px dashed var(--gris-sombre); }
.carte.verrou .icone { background: var(--creme); }
.carte.verrou .icone svg { opacity: .45; filter: grayscale(1); }
.carte.verrou p { margin: 0; font-size: 13px; color: var(--texte-2); font-weight: 700; }
.carte.verrou .btn { margin-top: 6px; width: 100%; }
.carte.verrou.secret { opacity: .55; }
.carte.verrou.secret h3 { color: var(--texte-2); }

/* ─── indice (tutoriel) ─── */
#indice { position: fixed; z-index: 6; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; width: min(78vw, 320px); }
#indice .bulle { padding: 10px 14px; border-radius: 18px; background: var(--texte); color: #fff; font: 700 15px/1.3 var(--texte-font); text-align: center; box-shadow: 0 6px 16px var(--ombre); text-wrap: balance; }
#indice .main { width: 36px; height: 36px; animation: tape .9s ease-in-out infinite; }
#indice.haut { flex-direction: column-reverse; }
#indice.haut .main { transform: rotate(180deg); animation-name: tapeHaut; }
@keyframes tape { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
@keyframes tapeHaut { 0%, 100% { transform: rotate(180deg) translateY(0); } 50% { transform: rotate(180deg) translateY(8px); } }

/* ─── feuilles ─── */
#voile { position: fixed; inset: 0; z-index: 7; background: rgba(74, 51, 40, .35); }
#feuille { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; max-height: 84%; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  background: var(--creme); border-radius: 28px 28px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); animation: monte .25s cubic-bezier(.2, .8, .2, 1); }
#feuille .poignee { width: 44px; height: 5px; margin: 0 auto 12px; border-radius: 3px; background: var(--gris-sombre); }
#feuille .inner { max-width: 520px; margin: 0 auto; }
@keyframes monte { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
h2 { margin: 0 0 4px; font: 700 26px/1.1 var(--titre); letter-spacing: -.01em; }
.sous { margin: 0 0 14px; color: var(--texte-2); font-weight: 700; }
.grand-nombre { font: 700 44px/1 var(--titre); color: var(--menthe-sombre); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.liste-am { display: grid; gap: 8px; }
.am { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 18px; background: var(--carte); box-shadow: 0 4px 12px var(--ombre); }
.am h3 { margin: 0; font: 700 16px/1.15 var(--titre); }
.am p { margin: 2px 0 0; font-size: 13px; color: var(--texte-2); }
.am .btn { min-width: 108px; }
.am.fait { opacity: .6; box-shadow: none; background: #FFFBF4; }
.am .ok { font: 700 14px/1 var(--titre); color: var(--menthe-sombre); padding: 0 8px; }
.stat { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--ligne); }
.stat:last-child { border-bottom: 0; }
.stat b { font: 700 16px/1 var(--titre); font-variant-numeric: tabular-nums; }
.detail { list-style: none; margin: 10px 0 14px; padding: 0; display: grid; gap: 4px; font-weight: 700; color: var(--texte-2); }
.detail li { display: flex; justify-content: space-between; gap: 8px; }
.detail li b { color: var(--texte); }
.ligne-reglage { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; }
.interrupteur { width: 56px; height: 32px; border-radius: 999px; background: var(--gris); position: relative; transition: background .15s; flex: 0 0 auto; }
.interrupteur::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px var(--ombre); transition: transform .15s; }
.interrupteur[aria-checked="true"] { background: var(--menthe); }
.interrupteur[aria-checked="true"]::after { transform: translateX(24px); }
.encadre { padding: 12px 14px; border-radius: 18px; background: var(--peche); margin: 10px 0 14px; font-weight: 700; }
.encadre.doux { background: #EFEAFF; }
.flottant { position: fixed; z-index: 5; pointer-events: none; font: 700 18px/1 var(--titre); color: var(--menthe-sombre); animation: monteFlotte .9s ease-out forwards; text-shadow: 0 2px 0 #fff; }
@keyframes monteFlotte { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%); z-index: 9; padding: 10px 16px; border-radius: 999px; background: var(--texte); color: #fff;
  font: 700 14px/1.2 var(--texte-font); box-shadow: 0 6px 16px var(--ombre); white-space: nowrap; animation: monte .25s ease-out; }
</style>
<div id="probe" aria-hidden="true"></div>
<header id="haut">
  <div class="solde">
    <span class="piece" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="22" r="17" fill="#E0A61E"/><circle cx="20" cy="19" r="17" fill="#FFC84A"/><circle cx="20" cy="19" r="12" fill="none" stroke="#E0A61E" stroke-width="2.5"/><text x="20" y="25" text-anchor="middle" font-family="Fredoka, Nunito, sans-serif" font-weight="700" font-size="16" fill="#8C6F62">€</text></svg></span>
    <div><b id="coins">0 €</b><small id="taux">—</small></div>
  </div>
  <div class="haut-btns">
    <button id="b-etoiles" class="pastille etoile" type="button" aria-label="Étoiles et nouvelle boutique"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z" fill="#fff" stroke="#E0A61E" stroke-width="1.5" stroke-linejoin="round"/></svg><span id="etoiles-n">0</span></button>
    <button id="b-son" class="pastille" type="button" aria-label="Son" aria-pressed="true"><svg id="son-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="#4A3328"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="#4A3328" stroke-width="2" stroke-linecap="round"/></svg><svg id="son-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 9v6h4l5 4V5L8 9z" fill="#B5A49A"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="#B5A49A" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
</header>
<canvas id="scene" aria-label="La boutique : les clients entrent, achètent et repartent."></canvas>
<main id="liste">
  <div class="barre-achat">
    <div class="modes" role="group" aria-label="Quantité à acheter">
      <button type="button" data-mode="1" class="actif">×1</button><button type="button" data-mode="10">×10</button><button type="button" data-mode="100">×100</button><button type="button" data-mode="max">Max</button>
    </div>
    <button id="b-ameliorations" class="btn-am" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.8 5.6L19.5 9l-5.7 1.4L12 16l-1.8-5.6L4.5 9l5.7-1.4z" fill="#fff"/><path d="M19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9z" fill="#fff"/></svg>Bonus</button>
  </div>
  <div id="cartes"></div>
</main>
<div id="indice" hidden><div class="bulle"><span id="indice-txt"></span></div><svg class="main" viewBox="0 0 36 36" aria-hidden="true"><path d="M14 33c-3 0-5-2-6-5l-3-8c-.5-1.4.3-2.7 1.6-3 1.1-.3 2.2.3 2.7 1.3l1.7 3.4V8.5c0-1.4 1.1-2.5 2.5-2.5S16 7.1 16 8.5V18h1v-8c0-1.4 1.1-2.5 2.5-2.5S22 8.6 22 10v8h1v-6c0-1.4 1.1-2.5 2.5-2.5S28 10.6 28 12v6h1v-3c0-1.4 1.1-2.5 2.5-2.5S34 13.6 34 15v9c0 5-4 9-9 9z" fill="#FFD7B5" stroke="#4A3328" stroke-width="2" stroke-linejoin="round"/></svg></div>
<div id="voile" hidden></div>
<div id="feuille" role="dialog" aria-modal="true" hidden><div class="poignee" aria-hidden="true"></div><div id="feuille-contenu" class="inner"></div></div>

<script>
/* ── game.js ── */
/* LE FOURNIL — économie, état, sauvegarde, absence, étoiles. Aucune dépendance au DOM : tourne aussi dans Node. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.GAME = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ─── les produits, dans l'ordre où on les débloque ───
  const PRODUITS = [
    { id: 'baguette', nom: 'Baguette', cout: 4, rev: 1, temps: 1, croiss: 1.07, staff: 1000, staffNom: 'Apprenti Léo', desc: 'Croustillante, chaude, la base.' },
    { id: 'croissant', nom: 'Croissant', cout: 60, rev: 20, temps: 3, croiss: 1.15, staff: 15000, staffNom: 'Apprentie Inès', desc: 'Pur beurre, feuilleté.' },
    { id: 'painchoc', nom: 'Pain au chocolat', cout: 720, rev: 150, temps: 6, croiss: 1.14, staff: 100000, staffNom: 'Mitron Sami', desc: 'Deux barres, pas une.' },
    { id: 'tarte', nom: 'Tarte aux pommes', cout: 8640, rev: 1200, temps: 12, croiss: 1.13, staff: 500000, staffNom: 'Pâtissière Rose', desc: 'La recette de mamie.' },
    { id: 'eclair', nom: 'Éclair au café', cout: 103680, rev: 10000, temps: 24, croiss: 1.12, staff: 1.2e6, staffNom: 'Pâtissier Malik', desc: 'Glacé, fondant, parfait.' },
    { id: 'macaron', nom: 'Macarons', cout: 1.24e6, rev: 90000, temps: 96, croiss: 1.11, staff: 1e7, staffNom: 'Cheffe Agathe', desc: 'Six parfums, zéro regret.' },
    { id: 'millefeuille', nom: 'Mille-feuille', cout: 1.5e7, rev: 8e5, temps: 384, croiss: 1.1, staff: 1.11e8, staffNom: 'Chef Augustin', desc: 'Mille, on a compté.' },
    { id: 'piece', nom: 'Pièce montée', cout: 1.8e8, rev: 7e6, temps: 1536, croiss: 1.09, staff: 5.55e8, staffNom: 'Maître Paulin', desc: 'Pour les grands jours.' },
  ];
  const PALIERS = [25, 50, 100, 200, 300, 400, 500, 750, 1000, 1500, 2000, 3000, 5000];
  // ─── améliorations : une seule fois chacune ───
  const AMELIORATIONS = [
    { id: 'farine', nom: 'Farine de tradition', cout: 25000, cible: ['baguette'], mult: 3, desc: 'Baguettes ×3' },
    { id: 'beurre', nom: 'Beurre AOP', cout: 300000, cible: ['croissant'], mult: 3, desc: 'Croissants ×3' },
    { id: 'enseigne', nom: 'Enseigne lumineuse', cout: 1.5e6, cible: null, mult: 2, desc: 'Tout ×2' },
    { id: 'chocolat', nom: 'Chocolat noir 70 %', cout: 4e6, cible: ['painchoc'], mult: 3, desc: 'Pains au chocolat ×3' },
    { id: 'pommes', nom: 'Pommes du verger', cout: 4e7, cible: ['tarte'], mult: 3, desc: 'Tartes ×3' },
    { id: 'four', nom: 'Four à sole', cout: 1e8, cible: ['baguette', 'croissant'], mult: 5, desc: 'Baguettes et croissants ×5' },
    { id: 'terrasse', nom: 'Terrasse ensoleillée', cout: 2.5e8, cible: null, mult: 2, desc: 'Tout ×2' },
    { id: 'cafe', nom: 'Café torréfié maison', cout: 6e8, cible: ['eclair'], mult: 3, desc: 'Éclairs ×3' },
    { id: 'amandes', nom: 'Amandes de Provence', cout: 7e9, cible: ['macaron'], mult: 3, desc: 'Macarons ×3' },
    { id: 'vitrine', nom: 'Vitrine réfrigérée', cout: 1e10, cible: ['tarte', 'eclair', 'macaron'], mult: 5, desc: 'Tartes, éclairs, macarons ×5' },
    { id: 'fidelite', nom: 'Carte de fidélité', cout: 2.5e10, cible: null, mult: 3, desc: 'Tout ×3' },
    { id: 'feuilletage', nom: 'Pâte feuilletée maison', cout: 9e10, cible: ['millefeuille'], mult: 3, desc: 'Mille-feuilles ×3' },
    { id: 'robot', nom: 'Robot pâtissier', cout: 1e12, cible: ['piece'], mult: 3, desc: 'Pièces montées ×3' },
    { id: 'franchise', nom: 'Réseau de franchises', cout: 2.5e13, cible: null, mult: 5, desc: 'Tout ×5' },
  ];
  const ETOILE_BONUS = 0.05;     // +5 % par étoile, pour toujours
  const ABSENCE_MAX_H = 8;       // les apprentis travaillent 8 h au plus pendant une absence

  // ─── état ───
  function newState(nowMs) {
    return {
      v: 2, coins: 0, lifetime: 0, lifetimeRun: 0, etoiles: 0, boutiques: 1,
      stations: PRODUITS.map((p, i) => ({ niv: i === 0 ? 1 : 0, staff: false, prog: 0, actif: false })), // on commence avec une fournée de baguettes
      ameliorations: {}, tuto: 0, lastSeen: nowMs, created: nowMs, son: true, vibre: true, mode: 1,
      stats: { taps: 0, ventes: 0, clients: 0 },
    };
  }

  // ─── calculs ───
  const palierMult = (niv) => Math.pow(2, PALIERS.filter((p) => niv >= p).length);
  const prochainPalier = (niv) => PALIERS.find((p) => p > niv) || null;
  function ameliorationMult(st, i) {
    let m = 1;
    for (const a of AMELIORATIONS) if (st.ameliorations[a.id] && (a.cible === null || a.cible.includes(PRODUITS[i].id))) m *= a.mult;
    return m;

  const on = (sel, fn) => fc.querySelectorAll(sel).forEach((b) => b.addEventListener('click', () => fn(b)));
  function sheetAmeliorations() {
    const items = G.AMELIORATIONS.map((a) => {
      const fait = st.ameliorations[a.id], ok = st.coins >= a.cout;
      return `<div class="am ${fait ? 'fait' : ''}"><div><h3>${esc(a.nom)}</h3><p>${esc(a.desc)}</p></div>${fait ? '<span class="ok">Acheté ✓</span>' : `<button type="button" class="btn ${ok ? 'lavande' : 'non'}" data-id="${a.id}"><small>Acheter</small><b>${G.fmtEur(a.cout)}</b></button>`}</div>`;
    }).join('');
    openSheet(`<h2>Améliorations</h2><p class="sous">Des recettes et des équipements qui multiplient tes gains, pour toujours.</p><div class="liste-am">${items}</div>`);
    on('[data-id]', (b) => { const r = G.amelioration(st, b.dataset.id); if (!r.ok) { son.non(); toast(`Il manque ${G.fmtEur(G.AMELIORATIONS.find((a) => a.id === b.dataset.id).cout - st.coins)}`); return; } son.deblocage(); buzz([10, 30, 10]); toast(`${r.a.nom} : ${r.a.desc}`); renderCards(true); hud(); save(); sheetAmeliorations(); });
  }
  function sheetEtoiles() {
    const gain = G.etoilesGagnables(st), bonus = Math.round(st.etoiles * G.ETOILE_BONUS * 100);
    openSheet(`<h2>Étoiles</h2><p class="sous">Boutique n°${st.boutiques} · ${st.etoiles} étoile${st.etoiles > 1 ? 's' : ''} · +${bonus} % sur tous les gains</p>
      <div class="encadre doux">Ouvrir une <b>nouvelle boutique</b> remet les produits et les euros à zéro, mais tu gardes tes étoiles pour toujours. Chaque étoile : <b>+${Math.round(G.ETOILE_BONUS * 100)} %</b> de gains. Plus tu as gagné dans cette boutique, plus tu en récoltes.</div>
      <div class="grand-nombre">+${gain} ★</div><p class="sous">à récolter maintenant (${G.fmtEur(st.lifetimeRun)} gagnés dans cette boutique)</p>
      <button type="button" class="btn large ${gain > 0 ? 'beurre' : 'non'}" data-a="prestige"><small>${gain > 0 ? 'Repartir avec' : 'Pas encore'}</small><b>${gain > 0 ? `+${gain} étoile${gain > 1 ? 's' : ''}` : 'Vends encore un peu'}</b></button>
      <h3 style="margin:18px 0 6px;font:700 16px/1 var(--titre)">Ta boutique</h3>
      <div class="stat"><span>Fournées vendues</span><b>${G.fmt(st.stats.ventes)}</b></div><div class="stat"><span>Clients servis</span><b>${G.fmt(st.stats.clients)}</b></div><div class="stat"><span>Gagné depuis le début</span><b>${G.fmtEur(st.lifetime)}</b></div>
      <div class="ligne-reglage"><span>Vibrations</span><button type="button" class="interrupteur" role="switch" aria-checked="${st.vibre}" data-a="vibre"></button></div>
      <button type="button" class="btn large" data-a="close" style="background:var(--texte);box-shadow:0 4px 0 #2b1d16"><b>Retour</b></button>`);
    on('[data-a="close"]', closeSheet);
    on('[data-a="vibre"]', (b) => { st.vibre = !st.vibre; b.setAttribute('aria-checked', st.vibre); save(); });
    on('[data-a="prestige"]', () => {
      if (G.etoilesGagnables(st) <= 0) { son.non(); return; }
      openSheet(`<h2>Nouvelle boutique ?</h2><p class="sous">Tu repars de la première baguette avec <b>${st.etoiles + gain} étoiles</b> (+${Math.round((st.etoiles + gain) * G.ETOILE_BONUS * 100)} % de gains). Les améliorations achetées sont perdues.</p>
        <button type="button" class="btn large beurre" data-a="oui"><b>Ouvrir la boutique n°${st.boutiques + 1}</b></button><button type="button" class="btn large non" data-a="non" style="margin-top:8px"><b>Rester ici</b></button>`);
      on('[data-a="non"]', sheetEtoiles);
      on('[data-a="oui"]', () => { const r = G.nouvelleBoutique(st, Date.now()); if (r.ok) { son.deblocage(); buzz([20, 40, 20]); SCENE.fete(); closeSheet(); toast(`Boutique n°${st.boutiques} ouverte : +${r.gain} ★`); st.tuto = Math.max(st.tuto, INDICES.length); renderCards(true); hud(); save(); } });
    });
  }
  function sheetRetour(abs) {
    const detail = abs.detail.slice().sort((a, b) => b.m - a.m).map((d) => `<li><span>${esc(G.PRODUITS[d.i].nom)} × ${G.fmt(d.n)}</span><b>${G.fmtEur(d.m)}</b></li>`).join('');
    openSheet(`<h2>Pendant ton absence</h2><p class="sous">${G.fmtDuree(abs.secs)}${abs.secs >= G.ABSENCE_MAX_H * 3600 ? ' (les apprentis s’arrêtent après 8 h)' : ''}</p>
      <div class="grand-nombre">+${G.fmtEur(abs.total)}</div><p class="sous">vendus par tes apprentis</p><ul class="detail">${detail}</ul>
      <button type="button" class="btn large menthe" data-a="close"><b>Super !</b></button>`);
    on('[data-a="close"]', closeSheet);
  }

  // ─── boucle ───
  function frame(now) {
    const dt = Math.min(0.25, Math.max(0, (now - lastFrame) / 1000)); lastFrame = now;
    const ventes = G.tick(st, dt);
    if (ventes.length) {
      const gros = ventes.reduce((a, v) => a + v.montant, 0);
      const first = ventes[0];
      if (G.PRODUITS[first.i].temps >= 3 || Math.random() < 0.15) { SCENE.vente(first.i, gros, '+' + G.fmtEur(gros)); son.vente(gros); }
      if (!st.stations[first.i].staff) { const r = cards[first.i].el.querySelector('.barre').getBoundingClientRect(); flottant(r.left + r.width / 2 - 30, r.top - 10, '+' + G.fmtEur(first.montant)); }
      renderCards();
    } else renderCards();
    hud();
    SCENE.frame(dt, st, Date.now());
    indices();
    if (now - lastSave > 5000) save();
    requestAnimationFrame(frame);
  }
  function layout() {
    const h = Math.max(150, Math.min(240, Math.round(window.innerHeight * 0.27)));
    SCENE.resize(window.innerWidth, h);
  }

  // ─── démarrage ───
  function boot() {
    st = load();
    const fresh = !st;
    if (fresh) st = G.newState(Date.now());
    SCENE.init($('#scene'));
    layout();
    buildCards();
    document.querySelectorAll('.modes button').forEach((b) => { b.classList.toggle('actif', String(st.mode) === b.dataset.mode); b.addEventListener('click', () => { st.mode = b.dataset.mode === 'max' ? 'max' : +b.dataset.mode; document.querySelectorAll('.modes button').forEach((x) => x.classList.toggle('actif', x === b)); renderCards(true); save(); }); });
    $('#cartes').addEventListener('click', onCardClick);
    $('#b-ameliorations').addEventListener('click', () => { audio(); sheetAmeliorations(); });
    $('#b-etoiles').addEventListener('click', () => { audio(); sheetEtoiles(); });
    $('#b-son').addEventListener('click', () => { audio(); st.son = !st.son; $('#b-son').setAttribute('aria-pressed', st.son); $('#son-on').hidden = !st.son; $('#son-off').hidden = st.son; save(); if (st.son) son.tap(); });
    $('#son-on').hidden = !st.son; $('#son-off').hidden = st.son; $('#b-son').setAttribute('aria-pressed', st.son);
    $('#scene').addEventListener('pointerdown', () => { audio(); SCENE.tap(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { const abs = G.absence(st, Date.now()); if (abs.total > 0 && abs.secs > 90) { sheetRetour(abs); renderCards(true); } lastFrame = performance.now(); } });
    window.addEventListener('pagehide', save);
    window.addEventListener('resize', layout);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
    if (!fresh) { const abs = G.absence(st, Date.now()); if (abs.total > 0 && abs.secs > 90) sheetRetour(abs); }
    renderCards(true); hud();
    lastFrame = performance.now();
    requestAnimationFrame(frame);
    window.__fournil = { get st() { return st; }, G, save, reset: () => { try { localStorage.removeItem(KEY); } catch (e) { /* rien */ } location.reload(); }, absence: (ms) => { st.lastSeen = Date.now() - ms; const abs = G.absence(st, Date.now()); sheetRetour(abs); renderCards(true); return abs; }, give: (n) => { G.gagner(st, n); renderCards(true); hud(); } };
  }
  document.addEventListener('DOMContentLoaded', boot);
  if (document.readyState !== 'loading') setTimeout(boot, 0);
  return { get st() { return st; } };
})();

</script>
